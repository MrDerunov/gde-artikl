<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#16342c">
<title>ГДЕ АРТИКЛЬ?!</title>
<style>
/* ===== base.css ===== */
/* base.css — структура, HUD, FX, базовые компоненты. Тема — theme.css */
:root{
  --stage-h: clamp(146px, 29vh, 264px);
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-arm: "Segoe UI", "Noto Sans Armenian", "DejaVu Sans", "Arial Unicode MS", sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "Courier New", monospace;
  --chalk: #f2ecd9;
  --board: #16342c;
  --board-deep: #0c211c;
  --board-light: #235247;
  --accent: #ffd23f;
  --warn: #ff5a5f;
  --good: #6fe08a;
  --ink: #1b1b1f;
  --paper: #f7efdf;
  --paper-2: #e8dcc4;
  --muted: #9db3aa;
  --wood: #6b4a2f;
  --stamp: #d62828;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{
  background:#07110e;
  color:var(--chalk);
  font-family:var(--font-ui);
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  overflow:hidden;
  isolation:isolate;
  background:radial-gradient(120% 90% at 50% 0%, #1a3c33 0%, #0b1c17 70%, #06110d 100%);
}
.stage-wrap{position:relative; flex:0 0 auto; height:var(--stage-h); z-index:20; overflow:visible}
#stage-canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
#stage-bubbles{position:absolute; inset:0; pointer-events:none; z-index:5}
#scene-wrap{position:relative; flex:1 1 auto; min-height:0; overflow:hidden; z-index:10; transition:background .4s ease}
#app.presenting .stage-wrap{ height: 100% }
#app.presenting #scene-wrap{ display: none }
#app.presenting .bubble{ font-size: clamp(14px, 3.2vw, 20px) }
#app.presenting .bubble.urgent{ font-size: clamp(20px, 5.4vw, 42px) }
#app.presenting-mobile .stage-wrap{ height: 42vh; }
#app.presenting-mobile #scene-wrap{ display: none }
#app.presenting-mobile .hud-screams{ display: none !important }
.scene-root{position:absolute; inset:0; overflow:hidden}
.scene-layer{position:absolute; inset:0; z-index:80; pointer-events:auto}
#fx-layer{position:absolute; inset:0; z-index:120; pointer-events:none}
#fx-layer .fx-interactive{pointer-events:auto}
#hud{
  position:absolute; z-index:300;
  right:max(10px, env(safe-area-inset-right));
  top:max(8px, env(safe-area-inset-top));
  display:flex; gap:8px; align-items:center;
}
.hud-btn{
  width:46px; height:46px; border-radius:50%;
  border:2px solid rgba(242,236,217,.5);
  background:rgba(8,22,18,.72);
  color:var(--chalk);
  font-size:19px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; padding:0; touch-action:manipulation;
  backdrop-filter:blur(3px);
  box-shadow:0 2px 8px rgba(0,0,0,.45);
}
.hud-btn:active{transform:scale(.93)}
.hud-btn.muted{opacity:.55}
.hud-skip{background:rgba(70,20,20,.8); border-color:#ff8a8a; font-size:17px}
.hud-screams{
  position:absolute; z-index:290;
  left:max(10px, env(safe-area-inset-left));
  bottom:max(8px, env(safe-area-inset-bottom));
  font:800 clamp(10px,2.5vw,13px)/1.1 var(--font-ui);
  letter-spacing:.04em; text-transform:uppercase;
  color:rgba(242,236,217,.66);
  background:rgba(6,16,13,.35);
  padding:4px 8px; border-radius:8px;
  pointer-events:none;
  display:none;
}
/* ====== кнопки ====== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; padding:10px 20px;
  border-radius:12px; border:3px solid var(--ink);
  background:var(--paper); color:var(--ink);
  font:800 clamp(14px,3.2vw,18px)/1.12 var(--font-ui);
  cursor:pointer; touch-action:manipulation;
  box-shadow:0 5px 0 var(--ink);
  transition:transform .07s ease, box-shadow .07s ease, filter .12s;
  text-align:center;
}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent)}
.btn.danger{background:var(--warn); color:#fff}
.btn.good{background:var(--good)}
.btn.ghost{background:rgba(8,22,18,.5); color:var(--chalk); border-color:var(--chalk); box-shadow:0 4px 0 rgba(242,236,217,.75)}
.btn.small{min-height:38px; padding:7px 14px; font-size:14px; box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{filter:grayscale(.8); opacity:.6; pointer-events:none}
.paper{
  background:var(--paper); color:var(--ink);
  border:3px solid var(--ink); border-radius:10px;
  box-shadow:0 6px 0 rgba(0,0,0,.35), inset 0 0 0 2px rgba(0,0,0,.06);
}
.arm{font-family:var(--font-arm)}
.chalk{color:var(--chalk)}
.mono{font-family:var(--font-mono)}
/* ====== бабблы ====== */
.bubble{
  position:absolute; max-width:min(74vw, 520px);
  background:var(--paper); color:#20211f;
  border:3px solid #20211f; border-radius:13px;
  padding:8px 12px 9px;
  font:700 clamp(12.5px,2.7vw,16px)/1.25 var(--font-ui);
  box-shadow:4px 5px 0 rgba(0,0,0,.4);
  opacity:0; transform:translateY(8px) scale(.96);
  transition:opacity .15s ease, transform .18s cubic-bezier(.2,1.4,.5,1);
  pointer-events:none;
  overflow-wrap:break-word;
  z-index:6;
}
.bubble.show{opacity:1; transform:none}
.bubble .who{
  display:block; margin-bottom:2px;
  font:800 9.5px/1.1 var(--font-ui);
  letter-spacing:.1em; text-transform:uppercase;
  opacity:.62;
}
.bubble.teacher{left:2%; top:3%; border-color:#8c2418; background:#fbf3dc}
.bubble.teacher .who{color:#8c2418}
.bubble.tolya{left:36%; bottom:30%; border-color:#2b5f9e; background:#eaf2ff}
.bubble.vika{left:49%; bottom:30%; border-color:#b3387a; background:#ffeaf5}
.bubble.gosha{right:2%; bottom:30%; border-color:#5a6b5f; background:#eef3ec}
.bubble.article{left:36%; top:16%; border-color:#a2700a; background:#fff6cf}
.bubble.police{right:2%; top:3%; border-color:#1d3a63; background:#e9effa}
.bubble.system{
  left:8%; top:8%; max-width:84%;
  background:#06110d; color:#8ff0b8;
  border-color:#2c6c4a; font-family:var(--font-mono);
  font-weight:600; letter-spacing:.02em;
}
.bubble.urgent{
  font-size:clamp(17px,4.6vw,30px);
  letter-spacing:.01em;
  padding:10px 16px;
  box-shadow:6px 7px 0 rgba(0,0,0,.5);
}
.bubble.urgent .who{font-size:11px}
@media (max-width:520px){
  .bubble.tolya{left:33%}
  .bubble.vika{left:46%; right:2%}
  .bubble.gosha{right:2%; bottom:44%}
}
/* ====== FX ====== */
@keyframes gshake{
  0%,100%{transform:translate(0,0) rotate(0)}
  12%{transform:translate(-7px,4px) rotate(-.5deg)}
  25%{transform:translate(6px,-5px) rotate(.5deg)}
  38%{transform:translate(-5px,-3px) rotate(-.4deg)}
  52%{transform:translate(5px,5px) rotate(.4deg)}
  68%{transform:translate(-4px,2px) rotate(-.25deg)}
  82%{transform:translate(3px,-2px) rotate(.2deg)}
}
@keyframes gshake-hard{
  0%,100%{transform:translate(0,0) rotate(0)}
  10%{transform:translate(-14px,8px) rotate(-1.2deg)}
  24%{transform:translate(12px,-10px) rotate(1deg)}
  38%{transform:translate(-11px,-6px) rotate(-.9deg)}
  52%{transform:translate(10px,10px) rotate(.8deg)}
  68%{transform:translate(-8px,4px) rotate(-.5deg)}
  84%{transform:translate(6px,-3px) rotate(.3deg)}
}
.fx-shake{animation:gshake .36s linear}
.fx-shake-hard{animation:gshake-hard .46s linear}
@keyframes gGlitch{
  0%{filter:none}
  20%{filter:hue-rotate(35deg) saturate(2.4) contrast(1.15); transform:translateX(-3px)}
  40%{filter:invert(.12) saturate(1.2); transform:translateX(3px)}
  60%{filter:hue-rotate(-25deg); transform:translateY(2px)}
  80%{filter:contrast(1.4); transform:translateX(-1px)}
  100%{filter:none; transform:none}
}
.fx-glitch{animation:gGlitch .32s steps(2) infinite}
.fx-flash-el{position:absolute; inset:0; pointer-events:none; animation:fxFlash .22s ease-out forwards}
@keyframes fxFlash{0%{opacity:.92}100%{opacity:0}}
.fx-burst-char{
  position:absolute; font:900 18px/1 var(--font-ui);
  pointer-events:none; will-change:transform, opacity;
  text-shadow:0 2px 0 rgba(0,0,0,.35);
}
.fx-card-wrap{
  position:absolute; inset:0; z-index:160;
  display:flex; align-items:center; justify-content:center;
  background:rgba(4,10,8,.8);
  padding:18px;
  pointer-events:auto;
  animation:fxCardIn .18s ease-out;
}
.fx-card{
  max-width:min(90vw,760px);
  background:var(--paper); color:#1c1c1c;
  border:4px solid #1c1c1c; border-radius:6px;
  padding:clamp(16px,4vw,34px) clamp(18px,4.5vw,40px);
  box-shadow:0 14px 0 rgba(0,0,0,.35);
  transform:rotate(-1deg);
  text-align:center;
}
.fx-card h2{margin:0; font:900 clamp(20px,5.2vw,42px)/1.05 var(--font-ui); letter-spacing:.02em}
.fx-card .sub{margin:10px 0 0; font:600 clamp(13px,3vw,17px)/1.35 var(--font-ui); opacity:.8}
.fx-card-wrap.out{animation:fxCardOut .2s ease-in forwards}
@keyframes fxCardIn{from{opacity:0}to{opacity:1}}
@keyframes fxCardOut{to{opacity:0}}
.fx-stamp{
  position:absolute; left:50%; top:36%;
  transform:translate(-50%,-50%) rotate(-8deg) scale(2.4);
  border:6px solid var(--stamp); color:var(--stamp);
  padding:10px 20px; border-radius:8px;
  font:900 clamp(16px,4.4vw,32px)/1.12 var(--font-ui);
  letter-spacing:.06em; text-transform:uppercase;
  text-align:center; max-width:88vw;
  background:rgba(255,255,255,.06);
  pointer-events:none; z-index:170;
  animation:stampSlam .3s cubic-bezier(.16,1.7,.4,1) forwards, stampFade .4s ease 1.35s forwards;
}
@keyframes stampSlam{
  0%{opacity:0; transform:translate(-50%,-50%) rotate(-14deg) scale(2.6)}
  55%{opacity:1; transform:translate(-50%,-50%) rotate(-8deg) scale(.94)}
  100%{opacity:1; transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
}
@keyframes stampFade{to{opacity:0; transform:translate(-50%,-50%) rotate(-8deg) scale(1.08)}}
.fx-overlay{position:absolute; inset:0; z-index:155; background:#000; pointer-events:auto}
.fx-overlay.silence{animation:silenceIn .3s ease-out both}
@keyframes silenceIn{from{opacity:0}to{opacity:1}}
.fx-window{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(92vw,560px); max-height:82vh; overflow:auto;
  background:#dcd7c8; color:#161616;
  border:3px solid #161616; border-radius:4px;
  box-shadow:0 16px 0 rgba(0,0,0,.4);
  z-index:180; pointer-events:auto;
  font-family:var(--font-mono);
  animation:winIn .14s ease-out;
}
@keyframes winIn{from{transform:translate(-50%,-46%) scale(.96); opacity:0}}
.fx-winbar{
  display:flex; align-items:center; justify-content:space-between;
  background:#1f3a63; color:#fff;
  padding:7px 10px; font:700 12px/1 var(--font-ui); letter-spacing:.05em;
}
.fx-winbar .dots{display:flex; gap:5px}
.fx-winbar .dot{width:10px; height:10px; border-radius:50%; background:#c9c9c9; border:1px solid #0c0c0c}
.fx-winbody{padding:16px 16px 18px; font:600 clamp(13px,3vw,16px)/1.4 var(--font-mono)}
.fx-winbtns{display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; padding:0 16px 16px}
.fx-winbtn{
  min-height:42px; padding:8px 16px;
  font:700 14px/1 var(--font-ui);
  border:2px solid #161616; background:#efeadb; color:#161616;
  border-radius:3px; cursor:pointer; box-shadow:0 3px 0 #161616;
  touch-action:manipulation;
}
.fx-winbtn.primary{background:var(--accent)}
.fx-winbtn.runaway{transition:transform .15s ease}
.fx-wrap-window{position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:175; pointer-events:auto}
/* ====== мелочи ====== */
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.scene-error-badge{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  background:#3a0f0f; color:#ffb4b4; border:2px solid #ff8a8a;
  padding:8px 14px; border-radius:10px;
  font:700 12px/1.2 var(--font-ui); z-index:400; pointer-events:none;
  max-width:92vw;
}
@media (max-height:520px){ :root{ --stage-h:144px; } }

/* ===== theme.css ===== */
/* ============================================================================
   «ГДЕ АРТИКЛЬ?!» — theme.css — палитра, шрифты, фактуры, анимации. Роль: Visual.
   Разделение с base.css (Lead): base.css — структура/лейаут/скины-каркасы,
   theme.css — палитра, типографика, фактуры, акценты и доп. анимации.
   Поэтому здесь НЕТ position/размеров/лейаута — только цвет, тень, фон, шрифт.
   Подключается после base.css. Свои классы сцен — с префиксом сцены (.ep1-, .ep2-).
   ============================================================================ */

/* ------------------------------------------------------------------ палитра */
:root {
  /* уточняем базовую палитру base.css (тёмно-зелёная доска, мел, бумага, штамп) */
  --chalk: #f6f2df;
  --chalk-dim: #c9cfb8;
  --board: #1d4534;
  --board-deep: #143127;
  --board-light: #265440;
  --accent: #ffd23f;
  --warn: #ff5a5f;
  --good: #6fe08a;
  --ink: #20242c;
  --ink-soft: #3c4552;
  --ink-pale: #6d7480;
  --paper: #f8f0d9;
  --paper-2: #e9dbbb;
  --paper-line: #cbb891;
  --paper-ink: #4a4336;
  --muted: #9db3aa;
  --wood: #7c4c2b;
  --stamp: #bf2f22;
  --stamp-dark: #8d1d13;
  --gold: #f2b62e;
  --gold-dark: #b8841a;
  --warm: #ffd479;

  /* новые токены темы */
  --bg: #151d18;
  --bg-deep: #0e1310;
  --panel: #223029;
  --panel-2: #1a251f;
  --line: #35473c;
  --cyan: #7fe3ff;
  --violet: #b98cff;
  --blush: #e88b8b;
  --teacher: #7d3347;
  --teacher-2: #a24a60;
  --tolya: #566b45;
  --tolya-2: #7d9463;
  --vika: #a63f6c;
  --vika-2: #cf6a94;
  --gosha: #3f7a48;
  --gosha-2: #62a35f;
  --article: #f2b62e;
  --police: #2f4a72;
  --police-2: #4a6b99;
  --system: #7fe3ff;

  /* шрифты: армянский — общим стеком с fallback'ами (TECH §1) */
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Armenian", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Armenian", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-arm: "Segoe UI", "Noto Sans Armenian", "DejaVu Sans", "Arial Unicode MS", Arial, sans-serif;
  --font-display: "Segoe UI", "Noto Sans Armenian", "DejaVu Sans", Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "Consolas", "Courier New", monospace;

  /* геометрия/тени/анимации */
  --radius: 14px;
  --radius-sm: 9px;
  --radius-pill: 999px;
  --shadow-2: 0 4px 0 rgba(0, 0, 0, 0.4), 0 10px 24px rgba(0, 0, 0, 0.35);
  --shadow-paper: 0 5px 0 rgba(0, 0, 0, 0.28), 0 14px 30px rgba(0, 0, 0, 0.4);
  --ease-pop: cubic-bezier(0.2, 1.5, 0.4, 1);
  --dur: 220ms;
}

::selection { background: var(--warm); color: #1b1a12; }

/* армянский текст — всегда реальным стеком, без подмены */
.arm, [lang="hy"], .hy, .word-arm, .ep-word, .fin-word { font-family: var(--font-arm); }
.arm-big { font-family: var(--font-arm); font-weight: 900; letter-spacing: 0.02em; }
.chalk-text {
  font-family: var(--font-display);
  color: var(--chalk);
  text-shadow: 0 0 1px rgba(255, 255, 255, 0.45), 0 1px 0 rgba(0, 0, 0, 0.4);
}
.ink-text { color: var(--ink); }

/* ------------------------------------------------------------------- КНОПКИ
   base.css задаёт каркас и состояния (.btn/.primary/.danger/.good/.ghost/.small).
   Тема добавляет объём: верхний блик, лёгкий градиент, фокус, «писклявые» мелочи. */
.btn {
  background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.34) 0%, rgba(255, 255, 255, 0) 46%, rgba(0, 0, 0, 0.07) 100%);
  font-family: var(--font-ui);
  letter-spacing: 0.015em;
  -webkit-tap-highlight-color: transparent;
}
.btn.primary { background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0) 48%, rgba(150, 96, 0, 0.14) 100%); }
.btn.danger { background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 46%, rgba(90, 0, 0, 0.22) 100%); }
.btn.good { background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.36) 0%, rgba(255, 255, 255, 0) 46%, rgba(0, 70, 30, 0.16) 100%); }
.btn.ghost { background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.06)); }
.btn:focus-visible { outline: 3px solid var(--warm); outline-offset: 3px; }
.btn:disabled, .btn[disabled] { filter: grayscale(0.75) brightness(0.86); }

/* алиасы-модификаторы (для будущих сцен и витрины; базовые — в base.css) */
.btn--primary { background-color: var(--gold); }
.btn--danger { background-color: var(--warn); }
.btn--ghost { background: rgba(8, 22, 18, 0.5); color: var(--chalk); }
.btn--huge { min-height: 62px; font-size: clamp(17px, 4.4vw, 24px); letter-spacing: 0.06em; }
.btn--small { min-height: 38px; font-size: 14px; }
.btn--block { display: flex; width: 100%; }
.btn--squeak { min-height: 30px; padding: 4px 10px; font-size: 12px; border-radius: 7px; }

/* ------------------------------------------------------------------ БАББЛЫ
   Позиции/размеры/показ — base.css (там .bubble.teacher и т.п. привязаны к сцене).
   Тема даёт палитру реплик по персонажам и «фактуру» бумаги. */
.bubble { --bubble-tail: 12px; }
.bubble.teacher { background: linear-gradient(165deg, #fdf5e4 0%, #f8e9e6 100%); border-color: #8c2418; }
.bubble.tolya { background: linear-gradient(165deg, #eef5e4 0%, #e8edd9 100%); border-color: #2b5f9e; }
.bubble.vika { background: linear-gradient(165deg, #fdeaf3 0%, #fbe4ee 100%); border-color: #b3387a; }
.bubble.gosha { background: linear-gradient(165deg, #eef5ec 0%, #e6f0df 100%); border-color: #5a6b5f; }
.bubble.article {
  background: linear-gradient(165deg, #fffbe8 0%, #fff6cf 100%);
  border-color: #a2700a;
  font-family: var(--font-arm);
  font-weight: 800;
}
.bubble.police { background: linear-gradient(165deg, #eef3fb 0%, #e9effa 100%); border-color: #1d3a63; }
.bubble.system { background: linear-gradient(165deg, #08150f 0%, #06110d 100%); }
.bubble .who { font-family: var(--font-ui); }
.bubble.urgent { animation: fx-bubble-wiggle 620ms ease-in-out infinite; }
.bubble.article .txt { font-family: var(--font-arm); }

/* самостоятельные скины-модификаторы (не используются сценой, удобны для демо) */
.bubble--teacher { --bubble-edge: #8c2418; }
.bubble--tolya { --bubble-edge: #2b5f9e; }
.bubble--vika { --bubble-edge: #b3387a; }
.bubble--gosha { --bubble-edge: #5a6b5f; }
.bubble--article { --bubble-edge: #a2700a; font-family: var(--font-arm); }
.bubble--police { --bubble-edge: #1d3a63; }
.bubble--system { --bubble-edge: #2c6c4a; font-family: var(--font-mono); }
.bubble--whisper { font-style: italic; opacity: 0.92; }

/* ---------------------------------------------------------- БУМАГА И КАРТОЧКИ
   base.css: .paper — базовый лист. Тема добавляет клетку/линейку и кант. */
.paper {
  position: relative;
  background-image:
    repeating-linear-gradient(180deg, transparent 0 25px, rgba(182, 160, 112, 0.16) 25px 26px),
    linear-gradient(160deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 60%, rgba(190, 165, 110, 0.14));
}
.paper::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px dashed rgba(120, 98, 60, 0.28);
  border-radius: 3px;
  pointer-events: none;
}
.paper--lined { line-height: 26px; }
.paper--protocol { border-top-color: var(--stamp); }
.paper .red, .paper b.red { color: var(--stamp); font-weight: 800; }

.card {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(0, 0, 0, 0.12)),
    var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: var(--chalk);
  box-shadow: var(--shadow-2);
}
.card--paper {
  background: linear-gradient(165deg, #fffaf0, var(--paper) 60%, var(--paper-2));
  border-color: var(--paper-line);
  color: var(--paper-ink);
}

/* доска-заглушка (если сцена хочет DOM-доску вместо canvas) */
.chalk-board {
  background:
    radial-gradient(120% 90% at 40% 20%, var(--board-light) 0%, var(--board) 55%, var(--board-deep) 100%);
  border: 8px solid var(--wood);
  border-radius: 6px;
  box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.55), var(--shadow-2);
}

/* -------------------------------------------------------------------- ПЕЧАТИ */
.seal, .stamp-seal {
  display: inline-grid;
  place-items: center;
  width: 96px; height: 96px;
  border-radius: 50%;
  border: 3px solid #e05a45;
  outline: 2px solid #e05a45;
  outline-offset: -9px;
  color: #ef6c55;
  font-family: var(--font-arm);
  font-weight: 900;
  font-size: 30px;
  line-height: 1;
  text-transform: uppercase;
  transform: rotate(-11deg);
  text-shadow: 0 0 10px rgba(224, 90, 69, 0.35);
}
.paper .seal, .paper .stamp-seal, .diploma .seal {
  color: var(--stamp);
  border-color: var(--stamp);
  outline-color: var(--stamp);
  text-shadow: none;
  mix-blend-mode: multiply;
}
.stamp-inline {
  display: inline-block;
  padding: 2px 8px;
  border: 2px solid var(--stamp);
  border-radius: 5px;
  color: var(--stamp);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.06em;
  transform: rotate(-3deg);
}

/* диплом финала (запасной скин, финальная сцена может использовать свои классы) */
.diploma {
  background:
    radial-gradient(100% 100% at 20% 0%, #fffbf0, var(--paper) 55%, #ecdcb8 100%);
  color: var(--paper-ink);
  border: 10px double var(--gold-dark);
  border-radius: 3px;
  box-shadow: var(--shadow-paper);
  padding: 22px 20px;
  text-align: center;
}
.diploma h1, .diploma h2 { font-family: var(--font-display); letter-spacing: 0.08em; }

/* ------------------------------------------------------------ HUD-мелочи */
.hud-chip, .stat-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background: rgba(9, 14, 11, 0.62);
  border: 1px solid var(--line);
  color: var(--chalk-dim);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
}
.hud-chip b, .stat-chip b { color: var(--warm); }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  background: var(--stamp);
  color: #fff4e2;
  font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
}
.badge--gold { background: var(--gold); color: #2a220d; }
.badge--ghost { background: transparent; border: 1px solid var(--line); color: var(--chalk-dim); }

/* ----------------------------------------------------------------- АНИМАЦИИ
   base.css уже вешает .fx-shake/.fx-glitch/.fx-stamp на свои keyframes.
   Тема даёт канонические keyframes (fx-shake/fx-flash/fx-glitch) и доп. утилиты,
   которые не пересекаются с базовыми именами классов. */
@keyframes fx-shake {
  0%, 100% { transform: translate(0, 0) rotate(0); }
  10% { transform: translate(-6px, 3px) rotate(-0.6deg); }
  20% { transform: translate(7px, -4px) rotate(0.7deg); }
  32% { transform: translate(-8px, 2px) rotate(-0.8deg); }
  44% { transform: translate(6px, 4px) rotate(0.5deg); }
  58% { transform: translate(-5px, -3px) rotate(-0.4deg); }
  72% { transform: translate(4px, 2px) rotate(0.3deg); }
  86% { transform: translate(-2px, 1px) rotate(-0.15deg); }
}
@keyframes fx-flash {
  0% { opacity: 0.92; }
  100% { opacity: 0; }
}
@keyframes fx-glitch {
  0%, 100% { transform: translate(0); filter: none; }
  8% { transform: translate(-4px, 2px); filter: hue-rotate(30deg) saturate(1.6); }
  16% { transform: translate(5px, -3px); filter: hue-rotate(-40deg); }
  24% { transform: translate(-3px, -2px) skewX(1.5deg); }
  34% { transform: translate(2px, 3px); filter: contrast(1.4); }
  46% { transform: translate(-6px, 0) skewX(-2deg); filter: hue-rotate(90deg); }
  58% { transform: translate(4px, 1px); filter: none; }
  70% { transform: translate(-2px, -2px) skewX(1deg); filter: saturate(0.4); }
  84% { transform: translate(2px, 2px); }
}
@keyframes fx-bubble-in {
  from { opacity: 0; transform: translateY(7px) scale(0.94); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes fx-bubble-wiggle {
  0%, 100% { transform: rotate(-0.7deg) scale(1); }
  50% { transform: rotate(0.7deg) scale(1.02); }
}
@keyframes fx-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
@keyframes fx-float {
  0%, 100% { transform: translate(0, 0) rotate(-1.5deg); }
  50% { transform: translate(0, -9px) rotate(1.5deg); }
}
@keyframes fx-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
@keyframes fx-wobble {
  0%, 100% { transform: rotate(-2deg); }
  50% { transform: rotate(2deg); }
}
@keyframes fx-pop-in {
  from { opacity: 0; transform: scale(0.5) rotate(-6deg); }
  70% { opacity: 1; transform: scale(1.08) rotate(2deg); }
  to { opacity: 1; transform: scale(1) rotate(0); }
}
@keyframes fx-stamp-hit {
  0% { opacity: 0; transform: scale(2.6) rotate(-16deg); }
  55% { opacity: 1; transform: scale(0.92) rotate(-8deg); }
  70% { transform: scale(1.04) rotate(-9.5deg); }
  100% { opacity: 1; transform: scale(1) rotate(-9deg); }
}
@keyframes fx-flicker {
  0%, 100% { opacity: 1; }
  12% { opacity: 0.55; }
  18% { opacity: 1; }
  31% { opacity: 0.28; }
  36% { opacity: 0.9; }
  55% { opacity: 0.6; }
  62% { opacity: 1; }
}
@keyframes fx-marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* доп. утилиты (без конфликта с base.css) */
.fx-bob { animation: fx-bob 2.1s ease-in-out infinite; }
.fx-float { animation: fx-float 3.4s ease-in-out infinite; }
.fx-pulse { animation: fx-pulse 1.5s ease-in-out infinite; }
.fx-wobble { animation: fx-wobble 1.8s ease-in-out infinite; }
.fx-pop-in { animation: fx-pop-in 260ms var(--ease-pop) both; }
.fx-marquee { animation: fx-marquee 16s linear infinite; }
.fx-flicker { animation: fx-flicker 900ms linear both; }
.fx-dim { filter: brightness(0.55) saturate(0.8); }

/* тёмная виньетка вокруг сцены, когда включён «студийный» режим */
#app.presenting #stage-wrap::after,
#app.presenting-mobile #stage-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(120% 90% at 50% 42%, transparent 42%, rgba(3, 8, 6, 0.7) 100%);
}
/* лёгкая «пыль мела» поверх классной сцены */
.stage-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.5;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 24%, rgba(246, 242, 223, 0.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 38% 62%, rgba(246, 242, 223, 0.26), transparent 60%),
    radial-gradient(1.5px 1.5px at 64% 18%, rgba(246, 242, 223, 0.3), transparent 60%),
    radial-gradient(1.2px 1.2px at 82% 48%, rgba(246, 242, 223, 0.22), transparent 60%),
    radial-gradient(1.2px 1.2px at 22% 78%, rgba(246, 242, 223, 0.2), transparent 60%);
}

@media (prefers-reduced-motion: reduce) {
  .fx-bob, .fx-float, .fx-pulse, .fx-wobble, .fx-marquee, .fx-flicker,
  .bubble.urgent { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
}

</style>

<body>
<noscript><div style="padding:24px;font:18px sans-serif;color:#fff">Для игры нужен JavaScript. Включите его и откройте файл ещё раз.</div></noscript>
<div id="app"></div>
<script>
/* ===== 00-core.js ===== */
/* 00-core.js — утилиты, состояние, FX, менеджер сцен, отладка. Lead. */
(function(){
'use strict';
var G = window.G = window.G || {};

/* ---------- params ---------- */
var params = {};
try {
  var q = new URLSearchParams(window.location.search);
  q.forEach(function(v, k){ params[k] = v; });
} catch(e) {}
G.params = params;

/* ---------- deterministic rng ---------- */
var seedNum = 0;
if (params.seed) { seedNum = (parseInt(params.seed, 10) || 1) >>> 0; }
var rng = Math.random;
if (seedNum) {
  rng = function(){
    seedNum |= 0; seedNum = (seedNum + 0x6D2B79F5) | 0;
    var t = Math.imul(seedNum ^ (seedNum >>> 15), 1 | seedNum);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
G.rng = rng;

/* ---------- utils ---------- */
var u = G.u = {};
u.rand = function(a, b){ if (b === undefined){ b = a; a = 0; } return a + rng() * (b - a); };
u.randInt = function(a, b){ return Math.floor(u.rand(a, b + 1)); };
u.choice = function(arr){ return arr[Math.floor(rng() * arr.length)]; };
u.chance = function(p){ return rng() < p; };
u.shuffle = function(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
};
u.clamp = function(v, a, b){ return v < a ? a : (v > b ? b : v); };
u.lerp = function(a, b, t){ return a + (b - a) * t; };
u.dist = function(x1, y1, x2, y2){ var dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); };
u.now = function(){ return performance.now() / 1000; };
u.isPortraitMobile = function(){ return window.innerWidth < 640 && window.innerHeight > window.innerWidth; };
u.$ = function(sel, root){ return (root || document).querySelector(sel); };
u.$ = function(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
u.el = function(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
};
u.on = function(el, ev, fn, opts){
  if (!el) return function(){};
  el.addEventListener(ev, fn, opts);
  return function(){ el.removeEventListener(ev, fn, opts); };
};
u.wait = function(ms){ return new Promise(function(res){ setTimeout(res, ms); }); };
u.css = function(cssText){
  if (!cssText) return null;
  var s = document.createElement('style');
  s.textContent = cssText;
  document.head.appendChild(s);
  return s;
};
u.point = function(ev){ return { x: ev.clientX, y: ev.clientY }; };
u.rect = function(el){ return el.getBoundingClientRect(); };
u.inRect = function(p, r){ return p.x >= r.left && p.x <= r.right && p.y >= r.top && p.y <= r.bottom; };
u.onTap = function(el, fn, opts){
  if (!el) return function(){};
  opts = opts || {};
  var last = 0, removed = false;
  function handler(ev){
    if (removed) return;
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    var now = Date.now();
    if (now - last < 70) return;
    last = now;
    if (opts.preventDefault !== false && ev.cancelable) ev.preventDefault();
    if (G.audio && G.audio.unlock){ try { G.audio.unlock(); } catch(e) {} }
    if (opts.once) off();
    try { fn(ev); } catch(e){ console.error(e); }
  }
  var off = u.on(el, 'pointerdown', handler, { passive: false });
  return function(){ removed = true; off(); };
};
u.drag = function(el, h){
  if (!el) return function(){};
  h = h || {};
  var active = false, pid = null;
  function down(ev){
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    if (h.canStart && h.canStart(ev) === false) return;
    if (ev.cancelable) ev.preventDefault();
    active = true; pid = ev.pointerId;
    var start = { x: ev.clientX, y: ev.clientY };
    try { el.setPointerCapture(pid); } catch(e) {}
    if (G.audio && G.audio.unlock){ try { G.audio.unlock(); } catch(e) {} }
    if (h.onStart) h.onStart(start, ev);
  }
  function move(ev){
    if (!active) return;
    var p = { x: ev.clientX, y: ev.clientY };
    if (h.onMove) h.onMove(p, ev);
  }
  function up(ev){
    if (!active) return;
    active = false;
    try { el.releasePointerCapture(pid); } catch(e) {}
    if (h.onEnd) h.onEnd({ x: ev.clientX, y: ev.clientY }, ev);
  }
  function cancel(ev){
    if (!active) return;
    active = false;
    if (h.onCancel) h.onCancel(ev);
  }
  var offs = [
    u.on(el, 'pointerdown', down, { passive: false }),
    u.on(el, 'pointermove', move, { passive: false }),
    u.on(el, 'pointerup', up, { passive: false }),
    u.on(el, 'pointercancel', cancel, { passive: false })
  ];
  return function(){ for (var i = 0; i < offs.length; i++){ try { offs[i](); } catch(e) {} } };
};

/* ---------- state ---------- */
var defaultStats = function(){
  return {
    errors: 0, articlesSaved: 0, articlesLost: 0, screams: 0,
    repeats: 0, lettersCaught: 0, memoryFinds: 0, loops: 0,
    bossHits: 0, protocols: 0, homeworkItems: 0, gagsFound: 0
  };
};
G.state = {
  running: false,
  sceneName: null,
  sceneLog: [],
  auto: params.auto === '1',
  startedAt: 0,
  muted: false,
  stats: defaultStats(),
  gags: {},
  achievements: {},
  flags: {}
};
try {
  var savedMute = window.localStorage.getItem('gde-artikl-muted');
  if (savedMute === null) savedMute = window.localStorage.getItem('gda-muted');
  if (savedMute === '1') G.state.muted = true;
} catch(e) {}
G.bump = function(key, n){
  var v = (n === undefined) ? 1 : n;
  G.state.stats[key] = (G.state.stats[key] || 0) + v;
};
G.gag = function(id){
  if (!id) return;
  if (!G.state.gags[id]){
    G.state.gags[id] = true;
    G.state.stats['gag:' + id] = 1;
    G.state.stats.gagsFound = (G.state.stats.gagsFound || 0) + 1;
  }
};
G.flag = function(name, val){ G.state.flags[name] = (val === undefined) ? true : val; return G.state.flags[name]; };
G.hasFlag = function(name){ return !!G.state.flags[name]; };

var FALLBACK_TEXT = {
  teacherName: 'Ануш Валерьевна',
  students: { tolya: 'Толя', vika: 'Вика', gosha: 'Гоша' },
  catchphrase: 'ГДЕ АРТИКЛЬ?!',
  screams: ['ГДЕ АРТИКЛЬ?!'],
  achievements: {},
  diploma: null
};

/* ---------- DOM refs ---------- */
var appEl, stageWrap, sceneWrap, fxLayerEl, hudEl, screamsEl, stageCanvas, bubblesEl;

G.buildUI = function(){
  appEl = document.getElementById('app');
  if (!appEl){ appEl = u.el('div'); appEl.id = 'app'; document.body.appendChild(appEl); }
  appEl.innerHTML = '';
  appEl.setAttribute('data-app', '');

  stageWrap = u.el('div', 'stage-wrap');
  stageWrap.id = 'stage-wrap';
  stageCanvas = document.createElement('canvas');
  stageCanvas.id = 'stage-canvas';
  bubblesEl = u.el('div');
  bubblesEl.id = 'stage-bubbles';
  stageWrap.appendChild(stageCanvas);
  stageWrap.appendChild(bubblesEl);

  sceneWrap = u.el('div');
  sceneWrap.id = 'scene-wrap';

  fxLayerEl = u.el('div');
  fxLayerEl.id = 'fx-layer';

  hudEl = u.el('div');
  hudEl.id = 'hud';

  appEl.appendChild(stageWrap);
  appEl.appendChild(sceneWrap);
  appEl.appendChild(fxLayerEl);
  appEl.appendChild(hudEl);

  screamsEl = u.el('div', 'hud-screams');
  screamsEl.id = 'hud-screams';
  appEl.appendChild(screamsEl);

  G.fx.init(appEl, fxLayerEl);
  G.hud.build(hudEl);

  G.stage.mount(stageWrap, stageCanvas, bubblesEl);

  if (G.audio && G.audio.setMuted){ try { G.audio.setMuted(G.state.muted); } catch(e) {} }
  G.hud.updateMute();
  G.hud.updateScreams(0);
};

/* ---------- HUD ---------- */
var hud = G.hud = {};
hud.build = function(parent){
  var sound = u.el('button', 'hud-btn');
  sound.id = 'hud-sound';
  sound.type = 'button';
  sound.setAttribute('aria-label', 'Звук');
  sound.textContent = '🔊';
  hud.sound = sound;
  parent.appendChild(sound);
  u.onTap(sound, function(){ hud.toggleMute(); });

  if (G.params.debug === '1'){
    var skip = u.el('button', 'hud-btn hud-skip', '⏭');
    skip.type = 'button';
    skip.setAttribute('aria-label', 'Пропустить сцену');
    hud.skip = skip;
    parent.appendChild(skip);
    u.onTap(skip, function(){ G.debug.skipCurrent(); });
  }
};
hud.toggleMute = function(){
  G.state.muted = !G.state.muted;
  if (G.audio && G.audio.setMuted){ try { G.audio.setMuted(G.state.muted); } catch(e) {} }
  try { window.localStorage.setItem('gde-artikl-muted', G.state.muted ? '1' : '0'); } catch(e) {}
  try { window.localStorage.setItem('gda-muted', G.state.muted ? '1' : '0'); } catch(e) {}
  hud.updateMute();
};
hud.updateMute = function(){
  if (!hud.sound) return;
  hud.sound.textContent = G.state.muted ? '🔇' : '🔊';
  hud.sound.classList.toggle('muted', !!G.state.muted);
};
hud.updateScreams = function(n){
  if (!screamsEl) return;
  n = n || 0;
  if (n <= 0){ screamsEl.style.display = 'none'; return; }
  screamsEl.style.display = 'block';
  screamsEl.textContent = '«' + ((G.text && G.text.catchphrase) || 'ГДЕ АРТИКЛЬ?!') + '» ×' + n;
};

/* ---------- FX ---------- */
var FX = G.fx = {};
var fxApp = null, fxLayer = null;
var fxNodes = [];
var fxPending = [];

FX.init = function(app, layer){ fxApp = app; fxLayer = layer; };
FX._add = function(node){ if (fxLayer) fxLayer.appendChild(node); fxNodes.push(node); return node; };
FX._remove = function(node){
  var i = fxNodes.indexOf(node);
  if (i >= 0) fxNodes.splice(i, 1);
  if (node && node.parentNode) node.parentNode.removeChild(node);
};
FX.reset = function(){
  for (var i = fxNodes.length - 1; i >= 0; i--){ try { FX._remove(fxNodes[i]); } catch(e) {} }
  fxNodes.length = 0;
  var pending = fxPending.slice();
  fxPending.length = 0;
  for (var j = 0; j < pending.length; j++){ try { pending[j](null); } catch(e) {} }
  if (fxApp){ fxApp.classList.remove('fx-glitch', 'fx-shake', 'fx-shake-hard'); }
};
FX.shake = function(power, ms){
  if (!fxApp) return;
  power = (power === undefined) ? 1 : power;
  ms = ms || 360;
  var cls = power >= 1.6 ? 'fx-shake-hard' : 'fx-shake';
  fxApp.classList.remove('fx-shake', 'fx-shake-hard');
  void fxApp.offsetWidth;
  fxApp.classList.add(cls);
  setTimeout(function(){ fxApp.classList.remove(cls); }, ms);
};
FX.flash = function(color, ms){
  if (!fxLayer) return;
  var el = u.el('div', 'fx-flash-el');
  el.style.background = color || '#ffffff';
  if (ms) el.style.animationDuration = (ms / 1000) + 's';
  FX._add(el);
  setTimeout(function(){ FX._remove(el); }, (ms || 240) + 40);
};
FX.glitch = function(ms){
  if (!fxApp) return;
  fxApp.classList.add('fx-glitch');
  setTimeout(function(){ fxApp.classList.remove('fx-glitch'); }, ms || 420);
};
FX.burst = function(x, y, opts){
  opts = opts || {};
  var count = opts.count || 12;
  var text = opts.text || 'Ը';
  var colors = opts.colors || ['#ffd23f', '#ff5a5f', '#6fe08a', '#f2ecd9', '#7cd4ff', '#f38bff'];
  if (!fxLayer) return;
  for (var i = 0; i < count; i++){
    var el = u.el('div', 'fx-burst-char');
    el.textContent = opts.randomText ? u.choice('ԸՆԲՊՓՁԾՑՋՃՉՐՌԱԵԻՈՒՏ') : text;
    el.style.color = u.choice(colors);

G.makeCtx = function(name, root, layer, resolveScene){
  var ctx = {
    name: name,
    root: root,
    layer: layer,
    done: false,
    auto: !!G.state.auto,
    h: u,
    fx: G.fx,
    audio: G.audio || null,
    stage: G.stage,
    state: G.state,
    text: G.text || FALLBACK_TEXT,
    params: G.params,
    _waits: new Set(),
    _rafs: new Set(),
    _cleanups: [],
    _finished: false
  };
  ctx.el = u.el;
  ctx.add = function(el){ root.appendChild(el); return el; };
  ctx.rect = u.rect;
  ctx.hit = function(p, el){ return u.inRect(p, el.getBoundingClientRect()); };
  ctx.isHit = ctx.hit;
  ctx.wait = function(ms){
    if (ctx.done) {
      var p0 = Promise.reject(SkipError());
      p0.catch(function(){});
      return p0;
    }
    var p = new Promise(function(resolve, reject){
      var entry = {};
      var timer = setTimeout(function(){
        ctx._waits.delete(entry);
        resolve();
      }, Math.max(0, ms || 0));
      entry.reject = function(){
        clearTimeout(timer);
        reject(SkipError());
      };
      ctx._waits.add(entry);
    });
    p.catch(function(){});
    return p;
  };
  ctx.raf = function(fn){
    var last = performance.now(), stopped = false, id = 0;
    function loop(now){
      if (stopped || ctx.done) return;
      var dt = Math.min(0.06, (now - last) / 1000);
      last = now;
      try { fn(dt, now / 1000); } catch(e){ console.error(e); }
      id = requestAnimationFrame(loop);

    ctx._cleanups.push(off);
    return off;
  };
  ctx.drag = function(el, h){
    var off = u.drag(el, h);
    ctx._cleanups.push(off);
    return off;
  };
  ctx.cleanup = function(fn){ if (typeof fn === 'function') ctx._cleanups.push(fn); };
  ctx.say = function(who, text, opts){
    if (ctx.done) return Promise.resolve();
    try { return G.stage.say(who, text, opts); } catch(e){ console.error(e); return Promise.resolve(); }
  };

  ctx.scream = function(text){ try { return G.stage.scream(text); } catch(e){ return Promise.resolve(); } };

  ctx.stat = function(k){ return G.state.stats[k] || 0; };
  ctx.achievement = function(id){ G.achievement(id); };
  ctx.fullscreen = function(show){ layer.style.display = (show === false) ? 'none' : 'block'; };
  ctx.layerEl = layer;
  ctx._finish = function(kind, err){
    if (ctx._finished) return;
    ctx._finished = true;
    ctx.done = true;
    if (kind === 'error'){ console.error('[scene ' + name + ']', err); G.notifySceneError(); }
    ctx._rafs.forEach(function(stop){ try { stop(); } catch(e) {} });
    ctx._rafs.clear();
    var waits = Array.from(ctx._waits);
    ctx._waits.clear();
    for (var i = 0; i < waits.length; i++){
      try {
        if (kind === 'ok') { /* normally none pending */ }
        else { waits[i].reject(); }
      } catch(e) {}
    }
    var cleanups = ctx._cleanups.slice();
    ctx._cleanups.length = 0;
    for (var j = 0; j < cleanups.length; j++){ try { cleanups[j](); } catch(e){ console.error(e); } }

    try { G.stage.clear(); } catch(e) {}

    if (layer.parentNode) layer.parentNode.removeChild(layer);

    try { resolveScene(kind); } catch(e) {}
  };
  ctx._abort = function(){ ctx._finish('skip'); };
  return ctx;
};

G.runSequence = async function(){
  while (G.state.running){
    if (G.singleScene){
      var single = G.singleScene;
      G.singleScene = null;
      await G.runScene(single);
      if (G._jump !== null){ G.seqIndex = G._jump; G._jump = null; continue; }
      break;
    }
    if (G.seqIndex >= G.sequence.length){ G.state.running = false; break; }
    var entryIndex = G.seqIndex;
    var name = G.sequence[entryIndex];
    if (!G.scenes[name]){ G.seqIndex = entryIndex + 1; continue; }
    await G.runScene(name);
    if (G._jump !== null){ G.seqIndex = G._jump; G._jump = null; continue; }
    G.seqIndex = entryIndex + 1;
  }
  G._loopActive = false;
};

/* ---------- bubbles ---------- */
S.say = function(who, text, opts){
  opts = opts || {};
  who = normWho(who);
  if (!S.bubblesEl) return Promise.resolve();
  var prev = S._bubbles[who];
  if (prev) prev.kill();
  var el = u.el('div', 'bubble ' + who + (opts.urgent ? ' urgent' : ''));
  var nameEl = u.el('span', 'who', labelFor(who));
  var txt = u.el('span', 'txt', String(text === undefined ? '' : text));
  el.appendChild(nameEl);
  el.appendChild(txt);
  S.bubblesEl.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  var ms = opts.ms;
  if (ms === undefined){
    ms = opts.urgent ? 1400 : Math.max(1100, Math.min(4300, 900 + String(text || '').length * 46));
  }
  var rec = { el: el };
  var promise = new Promise(function(resolve){
    var timer = null;
    rec.kill = function(){
      if (rec.dead) return;
      rec.dead = true;
      if (timer) clearTimeout(timer);
      el.classList.remove('show');
      setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 200);
      if (S._bubbles[who] === rec) delete S._bubbles[who];
      resolve();
    };
    timer = setTimeout(rec.kill, ms);
  });
  S._bubbles[who] = rec;
  return promise;
};

S.mood = function(who, mood){
  who = normWho(who);
  if (who === 'article'){
    if (S.props.article) S.props.article.mood = mood;
    return;
  }
  if (S.chars && S.chars[who]) S.chars[who].mood = mood;
};

S.scream = function(text, opts){
  opts = opts || {};
  text = text || (G.text && G.text.catchphrase) || 'ГДЕ АРТИКЛЬ?!';
  S.mood('teacher', 'scream');
  G.bump('screams');
  if (G.hud) G.hud.updateScreams(G.state.stats.screams);
  if (G.fx) G.fx.shake(1.55, 430);
  if (G.audio && G.audio.sfx){ try { G.audio.sfx('scream'); } catch(e) {} }
  var p = (opts.bubble === false) ? Promise.resolve() : S.say('teacher', text, { urgent: true, ms: 1300 });
  setTimeout(function(){ if (S.chars.teacher.mood === 'scream') S.mood('teacher', 'calm'); }, 1500);
  return p;
};

S.board = function(text){
  S.boardText = String(text === undefined || text === null ? '' : text);
};

S.prop = function(name, action, opts){
  opts = opts || {};
  if (!name) return;
  action = action || 'enter';
  var def = PROP_DEFS[name] || { x: 0.5, y: 0.3, w: 0.2, h: 0.3 };
  var W = S.W, H = S.H;
  var p = S.props[name];
  if (!p){
    p = S.props[name] = { visible: false, alpha: 0, placed: false, x: 0, y: 0, tx: 0, ty: 0, w: 0, h: 0, mood: opts.mood || 'idle' };
  }
  if (!p.placed){
    p.w = W * def.w; p.h = H * def.h;
    p.tx = W * def.x; p.ty = H * def.y;
    p.x = W * 1.2; p.y = p.ty;
    p.placed = true;
  }
  if (action === 'enter'){
    p.visible = true;
    p.alpha = 0;
    p.tx = W * def.x; p.ty = H * def.y;
    p.x = W * 1.25; p.y = p.ty;
    if (opts.mood) p.mood = opts.mood;
  } else if (action === 'exit'){
    p.tx = W * 1.3;
    if (opts.mood) p.mood = opts.mood;
    setTimeout(function(){ if (p) p.visible = false; }, 700);
  } else {
    p.visible = true;
    p.alpha = 1;
    if (opts.mood) p.mood = opts.mood;
    if (opts.x !== undefined) p.tx = W * opts.x;
    if (opts.y !== undefined) p.ty = H * opts.y;
  }
};

S.hideProp = function(name){ if (S.props[name]) S.props[name].visible = false; };
S.setPropMood = function(name, mood){ if (S.props[name]) S.props[name].mood = mood; };

S.visible = true;
S.show = function(){ S.visible = true; };
S.hide = function(){ S.visible = false; };
S.setVisible = function(v){ S.visible = !!v; };
S.presenting = function(v){
  S.presentingMode = !!v;
  var app = document.getElementById('app');
  if (app){
    app.classList.toggle('presenting', S.presentingMode && !u.isPortraitMobile());
    app.classList.toggle('presenting-mobile', S.presentingMode && u.isPortraitMobile());
  }
  setTimeout(S.resize, 60);
};

S.clear = function(){
  for (var who in S._bubbles){
    if (Object.prototype.hasOwnProperty.call(S._bubbles, who)) S._bubbles[who].kill();
  }
  S._bubbles = {};
  S.boardText = '';
  S.props = {};
  S.visible = true;
  S.presentingMode = false;
  try { S.presenting(false); } catch(e) {}
  if (S.chars){
    for (var k in S.chars){
      if (Object.prototype.hasOwnProperty.call(S.chars, k)) S.chars[k].mood = 'neutral';
    }
  }
};

    if (o.halo) strokeEll(ctx, cx, cy2, rx * 1.1, h * 1.15, Math.max(1.1, rx * 0.42), o.halo);
    fillEll(ctx, cx, cy2, rx, h, o.white || '#fbf8ef');
    strokeEll(ctx, cx, cy2, rx, h, Math.max(0.7, rx * 0.17), ink);
    if (o.lash) lashLine(ctx, cx, cy2, rx, h, o.lashCol || ink, o.lash);
    var pr = o.pupilR == null ? Math.min(rx, h) * 0.54 : o.pupilR;
    var px = cx + (o.lookX || 0) * rx * 0.4;
    var py = cy2 + (o.lookY || 0) * h * 0.4;
    fillEll(ctx, px, py, pr, pr, o.pupil || C.ink);
    if (o.glint !== false) fillEll(ctx, px - pr * 0.36, py - pr * 0.4, pr * 0.36, pr * 0.36, '#ffffff');
  }
  function lashLine(ctx, cx, cy, rx, ry, col, n) {
    n = n || 2;
    for (var i = 0; i < n; i++) {

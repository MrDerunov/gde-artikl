function ensureCss(){
  if (CSS_ONCE) return;
  CSS_ONCE = true;
  u.css(CSS.join('\n'));
}

var WORDS = [
  { word:'տուն',  ru:'дом',     art:'ը', full:'տունը',  line:'Дом. Теперь определённый. Наконец-то.' },
  { word:'կատու', ru:'кот',     art:'ն', full:'կատուն', line:'Мяу. И теперь определённо мяу.' },
  { word:'գիրք',  ru:'книга',   art:'ը', full:'գիրքը',  line:'Книга. С артиклем. Как в библиотеке.' },
  { word:'տղա',   ru:'мальчик', art:'ն', full:'տղան',   line:'Мальчик определённый. Он согласен.' },
  { word:'հաց',   ru:'хлеб',    art:'ը', full:'հացը',   line:'Хлеб. Артикль прилип. Оба довольны.' },
  { word:'ջուր',  ru:'вода',    art:'ը', full:'ջուրը',  line:'Вода. Определённая. Мокрая. Мокрая.' }
];

var SPEEDS = [58, 76, 94, 112, 128, 150];
var ROUND_HINT = [
  'Поймай артикль тапом, потом тапни слово. Или перетащи его на слово.',
  'Он бегает быстрее. Он же артикль, он тренируется.',
  'Один артикль спит. Разбуди его тапом. Потом лови.',
  'Артикли меняются местами. Смотри на букву, не на место.',
  'Артикль вышел с плакатом. Уважай его позицию и лови.',
  'Артикли убегают с экрана. Они вернутся. Дождись.'
];
var ROUND_TOAST = [
  '', '', 'Артикль спит. Ему снится место в ООН.', 'Их двое. Они поменялись. Принципиально.',
  'АРТИКЛЬ — НЕ ПРИЛОЖЕНИЕ! (с)', 'Артикли вышли из класса. У них дождь.'
];

G.scenes.article = async function(c){
  ensureCss();
  var h = c.h;

  /* ---------- UI ---------- */
  var wrap = c.add(h.el('div', 'ep1-wrap'));
  if (c.auto){
    wrap.appendChild(h.el('div', 'ep1-auto', 'ЭП1 · АВТОПРОХОД'));
    await c.wait(1100).catch(function(){});
    c.bump('articlesSaved', 6);
    c.bump('protocols', 1);
    c.bump('screams', 1);
    c.gag('ep1_auto');
    return;
  }

  var hud = h.el('div', 'ep1-hud');
  hud.appendChild(h.el('div', 'ep1-title', 'ГДЕ АРТИКЛЬ?!'));
  var dots = h.el('div', 'ep1-dots');
  var dotEls = [];
  for (var d = 0; d < 6; d++){ var dot = h.el('i', 'ep1-dot'); dots.appendChild(dot); dotEls.push(dot); }
  hud.appendChild(dots);
  var score = h.el('div', 'ep1-score');
  var scoreSaved = h.el('b', null, '0');
  var scoreProt = h.el('b', null, '0');
  score.appendChild(document.createTextNode('СПАСЕНО '));
  score.appendChild(scoreSaved);
  score.appendChild(document.createTextNode('/6 · ПРОТОКОЛОВ '));
  score.appendChild(scoreProt);
  hud.appendChild(score);
  wrap.appendChild(hud);

  var field = h.el('div', 'ep1-field');
  wrap.appendChild(field);

  var wordEl = h.el('div', 'ep1-word');
  var card = h.el('div', 'ep1-card');
  var wordline = h.el('div', 'ep1-wordline');
  var wordLet = h.el('span', 'ep1-let ep1-arm');
  var slotEl = h.el('span', 'ep1-slot ep1-arm');
  var ruEl = h.el('div', 'ep1-ru');
  wordline.appendChild(wordLet); wordline.appendChild(slotEl);
  card.appendChild(wordline); card.appendChild(ruEl);
  wordEl.appendChild(card);
  var wordSay = h.el('div', 'ep1-word-say');
  wordEl.appendChild(wordSay);
  field.appendChild(wordEl);

  var toastEl = h.el('div', 'ep1-toast');
  field.appendChild(toastEl);
  var whisperEl = h.el('div', 'ep1-whisper');
  field.appendChild(whisperEl);
  var hintEl = h.el('div', 'ep1-hintbar');
  field.appendChild(hintEl);

  /* ---------- state ---------- */
  var busy = false, selected = null, arts = [];
  var roundIdx = 0, roundErrors = 0, errorsTotal = 0, saved = 0, protocols = 0;
  var speed = SPEEDS[0], swapTimer = 0, fleeTimer = 0;
  var lastScream = -99, swapTold = false, fleeBackTold = false;
  var pointer = { x: 0, y: 0, active: false };
  var endResolve = null;
  var endPromise = new Promise(function(res){ endResolve = res; });

  function sfx(name){ try { if (G.audio && G.audio.sfx) G.audio.sfx(name); } catch(e){} }
  function sw(ms){ return c.wait(ms).catch(function(){}); }
  function tr(x, y){ return 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)'; }
  function runAsync(fn){
    try {
      var p = fn();
      if (p && p.catch) p.catch(function(e){ if (e && e.__skip) return; console.error('[ep1]', e); });
    } catch(e){ if (!(e && e.__skip)) console.error('[ep1]', e); }
  }
  function pickLine(arr, fallback){
    try { if (arr && arr.length) return u.choice(arr); } catch(e){}
    return fallback || '';
  }

  function updateHud(){
    scoreSaved.textContent = String(saved);
    scoreProt.textContent = String(protocols);
    for (var i = 0; i < dotEls.length; i++){
      dotEls[i].classList.toggle('on', i < saved);
      dotEls[i].classList.toggle('now', i === saved);
    }
  }

  function toast(text){
    if (!text) return;
    toastEl.textContent = text;
    toastEl.classList.remove('ep1-toast-show');
    void toastEl.offsetWidth;
    toastEl.classList.add('ep1-toast-show');
  }

  function showWhisper(){
    var w = WORDS[roundIdx] || WORDS[0];
    whisperEl.textContent = w.art === 'ն'
      ? '...шёпот из-за доски: после гласной — Ն...'
      : '...шёпот из-за доски: после согласной — Ը...';
    whisperEl.classList.add('ep1-whisper-show');
    c.gag('ep1_whisper');
    c.wait(2900).then(function(){ if (!c.done) whisperEl.classList.remove('ep1-whisper-show'); }, function(){});
  }

  function wordHit(){
    wordEl.classList.remove('ep1-hit');
    void wordEl.offsetWidth;
    wordEl.classList.add('ep1-hit');
  }

  function plusPop(){
    var p = h.el('div', 'ep1-plus', '+1');
    wordEl.appendChild(p);
    void p.offsetWidth;
    p.classList.add('ep1-plus-show');
    p.addEventListener('animationend', function(){ if (p.parentNode) p.parentNode.removeChild(p); });
  }

  function showWordLine(text){
    if (!text) return;
    wordSay.textContent = text;
    wordSay.classList.remove('ep1-say-show');
    void wordSay.offsetWidth;
    wordSay.classList.add('ep1-say-show');
  }

  function setWord(i){
    var w = WORDS[i];
    wordSay.classList.remove('ep1-say-show');
    wordSay.textContent = '';
    wordLet.textContent = w.word;
    ruEl.textContent = w.ru;
    slotEl.textContent = '';
    slotEl.classList.remove('ep1-filled');
    wordEl.classList.remove('ep1-defined', 'ep1-armed', 'ep1-word-target', 'ep1-word-fly');
    wordEl.classList.remove('ep1-write');
    void wordEl.offsetWidth;
    wordEl.classList.add('ep1-write');
    wordEl.dataset.need = w.art;
    wordEl.dataset.word = w.word;
  }

  /* ---------- геометрия ---------- */
  function fieldSize(){ return { W: field.clientWidth || 390, H: field.clientHeight || 400 }; }
  function wordBox(W, H){
    var ww = wordEl.offsetWidth || 180, wh = wordEl.offsetHeight || 110;
    return { ww: ww, wh: wh, cx: W * 0.5, cy: H * 0.44 };
  }
  function isOverWord(p){
    var r = wordEl.getBoundingClientRect();
    return p.x > r.left - 20 && p.x < r.right + 20 && p.y > r.top - 20 && p.y < r.bottom + 20;
  }
  function clampArt(a){
    var s = fieldSize();
    a.x = u.clamp(a.x, 4, Math.max(4, s.W - ART_W - 4));
    a.y = u.clamp(a.y, 4, Math.max(4, s.H - ART_H - 4));
  }
  function randomSpot(a){
    var s = fieldSize();
    var wb = wordBox(s.W, s.H);
    for (var k = 0; k < 50; k++){
      var x = u.rand(8, Math.max(9, s.W - ART_W - 8));
      var y = u.rand(8, Math.max(9, s.H - ART_H - 8));
      if (Math.abs(x + ART_W * 0.5 - wb.cx) < wb.ww * 0.5 + 66 &&
          Math.abs(y + ART_H * 0.5 - wb.cy) < wb.wh * 0.5 + 66) continue;
      var ok = true;
      for (var j = 0; j < arts.length; j++){
        var o = arts[j];
        if (o === a) continue;
        if (u.dist(x, y, o.x, o.y) < 130){ ok = false; break; }
      }
      if (!ok) continue;
      a.x = x; a.y = y;
      return;
    }
    a.x = u.rand(8, Math.max(9, s.W - ART_W - 8));
    a.y = u.rand(8, Math.max(9, s.H - ART_H - 8));
  }
  function setVelocity(a, sp){
    var ang = u.rand(0, Math.PI * 2);
    a.vx = Math.cos(ang) * sp;
    a.vy = Math.sin(ang) * sp;
  }

  /* ---------- отрисовка артикля (G.art.drawArticle, fallback — CSS-круг) ---------- */
  function makeCreatureVis(){
    var canvas = null, ctx = null;
    if (G.art && typeof G.art.drawArticle === 'function'){
      canvas = document.createElement('canvas');
      canvas.className = 'ep1-art-canvas';
      canvas.width = Math.round(ART_W * ART_DPR);
      canvas.height = Math.round(ART_H * ART_DPR);
      ctx = canvas.getContext('2d');
      if (ctx) ctx.setTransform(ART_DPR, 0, 0, ART_DPR, 0, 0);
      return { node: canvas, canvas: canvas, ctx: ctx };
    }
    var fb = h.el('div', 'ep1-art-fallback');
    return { node: fb, canvas: null, ctx: null };
  }

  function drawCreature(a, t){
    if (!a.canvas || !a.ctx) return;
    var mood = 'run';
    if (a.asleep) mood = 'sleep';
    else if (a.picket) mood = 'angry';
    else if (selected === a || a.state === 'picked' || a.state === 'dragging') mood = 'proud';
    else if (a.state === 'flee') mood = 'run';
    try {
      a.ctx.clearRect(0, 0, ART_W, ART_H);
      G.art.drawArticle(a.ctx, { x: 0, y: 0, w: ART_W, h: ART_H }, mood, t, { glyph: a.glyph });
    } catch(e){}
  }

  /* ---------- раунды ---------- */
  function removeAllArts(){
    for (var i = 0; i < arts.length; i++){
      var a = arts[i];
      if (a.el && a.el.parentNode) a.el.parentNode.removeChild(a.el);
    }
    arts = [];
    selected = null;
  }

  function spawnArts(){
    var s = fieldSize();
    var need = WORDS[roundIdx].art;
    var glyphs = u.shuffle(['ը', 'ն']);
    for (var i = 0; i < 2; i++){
      var glyph = glyphs[i];
      var el = h.el('div', 'ep1-art ep1-spawn');
      el.dataset.art = glyph;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', 'Артикль ' + glyph);
      var vis = makeCreatureVis();
      el.appendChild(vis.node);
      var picket = h.el('div', 'ep1-art-picket', 'АРТИКЛЬ — НЕ ПРИЛОЖЕНИЕ!');
      el.appendChild(picket);
      field.appendChild(el);
      var a = {
        el: el, glyph: glyph, x: 0, y: 0, vx: 0, vy: 0,
        phase: u.rand(0, Math.PI * 2), speedMul: u.rand(0.9, 1.12),
        state: 'run', asleep: false, lockUntil: 0, picket: false,
        awayUntil: 0, lostCounted: false,
        canvas: vis.canvas, ctx: vis.ctx
      };
      a.speedMul = u.rand(0.92, 1.1);
      randomSpot(a);
      setVelocity(a, speed);
      a.el.style.transform = tr(a.x, a.y);
      arts.push(a);
      bindArt(a);
    }
    var correct = null;
    for (var k = 0; k < arts.length; k++){ if (arts[k].glyph === need) correct = arts[k]; }
    if (roundIdx === 2 && correct){
      correct.asleep = true;
      correct.state = 'sleep';
      correct.vx = 0; correct.vy = 0;
      correct.el.classList.add('ep1-asleep');
      var s2 = fieldSize();
      correct.x = u.clamp(s2.W * 0.2, 10, s2.W - ART_W - 10);
      correct.y = u.clamp(s2.H * 0.66, 10, s2.H - ART_H - 10);
      correct.el.style.transform = tr(correct.x, correct.y);
      c.gag('article_sleep');
    }
    if (roundIdx === 4 && correct){
      correct.picket = true;
      correct.el.classList.add('ep1-picket-on');
      c.gag('article_picket');
    }
    if (roundIdx === 3) c.gag('article_swap');
    if (roundIdx === 5) c.gag('article_flee_start');
    updateHud();
    // если артиклей стало меньше одного (на всякий случай) — обновим
    if (arts.length < 2) c.gag('ep1_short_round');
    return s;
  }

  function startRound(i){
    roundIdx = i;
    roundErrors = 0;
    busy = true;
    selected = null;
    swapTimer = 0; fleeTimer = 0; swapTold = false; fleeBackTold = false;
    setWord(i);
    hintEl.textContent = ROUND_HINT[i] || '';
    removeAllArts();
    updateHud();
    sfx('chalk');
    return sw(300).then(function(){
      if (c.done) return;
      spawnArts();
      speed = SPEEDS[i] || 100;
      busy = false;
      if (ROUND_TOAST[i]) toast(ROUND_TOAST[i]);
      var esc = (c.text && c.text.pools && c.text.pools.ep1 && c.text.pools.ep1.esc) || [];
      if (i >= 2){ var line = esc[i - 2]; if (line) c.say('teacher', line, { mood: 'suspicious', ms: 1250 }); }
      c.gag('ep1_round_' + (i + 1));
    });
  }

  /* ---------- выбор артикля ---------- */
  function wake(a){
    if (!a || !a.asleep || busy) return;
    a.asleep = false;
    a.state = 'run';
    a.lockUntil = u.now() + 0.45;
    a.el.classList.remove('ep1-asleep');
    sfx('ding');
    toast('Он проснулся. Недовольно.');
    c.gag('article_wake');
    setVelocity(a, speed * 1.1);
    var lines = (c.text && c.text.article && c.text.article.lines) || [];
    if (lines.length) c.say('article', u.choice(lines), { mood: 'angry', ms: 1200 });
  }

  function pick(a){
    if (busy || !a || c.done) return;
    if (u.now() < (a.lockUntil || 0)) return;
    if (a.asleep){ wake(a); return; }
    if (selected === a) return;
    if (selected){
      selected.state = 'run';
      selected.el.classList.remove('ep1-picked');
    }
    selected = a;
    a.state = 'picked';
    a.el.classList.add('ep1-picked');
    wordEl.classList.add('ep1-armed');
    sfx('click');
    if (a.picket){
      toast('Плакат: «АРТИКЛЬ — НЕ ПРИЛОЖЕНИЕ!»');
      c.gag('article_picket_pick');
    } else {
      toast('Тапни слово или перетащи артикль.');
    }
  }

  /* ---------- drag & drop ---------- */
  function bindArt(a){
    c.tap(a.el, function(){
      if (busy || c.done) return;
      pick(a);
    });
    var ds = { on: false, offX: 0, offY: 0 };
    c.drag(a.el, {
      canStart: function(){ return !busy && !c.done; },
      onStart: function(p){
        if (busy || c.done) return;
        if (selected !== a) pick(a);
        if (selected !== a){ ds.on = false; return; }
        var r = a.el.getBoundingClientRect();
        ds.on = true;
        ds.offX = p.x - r.left;
        ds.offY = p.y - r.top;
        a.state = 'dragging';
        a.el.classList.add('ep1-dragging');
        a.el.style.transition = 'none';
        sfx('whoosh');
      },
      onMove: function(p){
        if (!ds.on || busy) return;
        var f = field.getBoundingClientRect();
        a.x = p.x - f.left - ds.offX;
        a.y = p.y - f.top - ds.offY;
        a.el.style.transform = tr(a.x, a.y) + ' scale(1.12)';
        wordEl.classList.toggle('ep1-word-target', isOverWord(p));
      },
      onEnd: function(p){
        if (!ds.on) return;
        ds.on = false;
        a.el.classList.remove('ep1-dragging');
        a.el.style.transition = '';
        wordEl.classList.remove('ep1-word-target');
        if (busy || c.done) return;
        if (isOverWord(p)){
          if (selected !== a) pick(a);
          if (selected === a){
            selected = null;
            wordEl.classList.remove('ep1-armed');
            startAttach(a);
          }
        } else {
          clampArt(a);
          a.state = 'picked';
        }
      },
      onCancel: function(){
        ds.on = false;
        a.el.classList.remove('ep1-dragging');
        wordEl.classList.remove('ep1-word-target');
      }
    });
  }

  /* ---------- крепление ---------- */
  function startAttach(a){
    if (busy || c.done) return;
    if (a.glyph === WORDS[roundIdx].art) runAsync(function(){ return onCorrect(a); });
    else runAsync(function(){ return onFail(a); });
  }

  async function onCorrect(a){
    busy = true;
    selected = null;
    wordEl.classList.remove('ep1-armed');
    saved++;
    c.bump('articlesSaved');
    c.gag('article_ate');
    sfx('pop');
    hintEl.textContent = 'Артикль на месте. Слово стало определённым.';
    try {
      var slotR = slotEl.getBoundingClientRect();
      var aR = a.el.getBoundingClientRect();
      var dx = (slotR.left + slotR.width / 2) - (aR.left + aR.width / 2);
      var dy = (slotR.top + slotR.height / 2) - (aR.top + ART_H * 0.5);
      a.state = 'eaten';
      a.el.style.transition = 'transform .38s cubic-bezier(.25,.9,.3,1), opacity .38s ease';
      a.el.style.transform = tr(a.x + dx, a.y + dy) + ' scale(.45)';
      await sw(360);
      if (c.done) return;
      a.el.style.opacity = '0';
      if (a.el.parentNode) a.el.parentNode.removeChild(a.el);
      var idx = arts.indexOf(a);
      if (idx >= 0) arts.splice(idx, 1);
      slotEl.textContent = a.glyph;
      slotEl.classList.add('ep1-filled');
      wordEl.classList.add('ep1-defined');
      sfx('correct');
      var f = field.getBoundingClientRect();
      G.fx.burst(f.left + slotR.left + slotR.width / 2, f.top + slotR.top + slotR.height / 2, {
        text: a.glyph, count: 10, spread: 110, size: 20,
        colors: ['#ffd23f', '#fff6cf', '#6fe08a']
      });
      plusPop();
      showWordLine(WORDS[roundIdx].line);
      updateHud();
      if (saved === 3) c.say('teacher', 'Хорошо.', { mood: 'proud', ms: 950 });
      wordGag(roundIdx);
      c.wait(760).then(function(){
        if (c.done) return;
        if (roundIdx === WORDS.length - 1) runAsync(function(){ return finale(); });
        else runAsync(function(){ return startRound(roundIdx + 1); });
      }, function(){});
    } catch(e){
      if (!(e && e.__skip)) console.error('[ep1]', e);
    }
  }

  function wordGag(i){
    var article = (c.text && c.text.article && c.text.article.lines) || ['Я не приложение. Я личность.'];
    if (i === 0) c.say('teacher', 'Один. Осталось пять. Не расслабляйтесь.', { mood: 'tired', ms: 1000 });
    else if (i === 1) c.say('vika', 'Я это знала. Кот тоже.', { mood: 'smug', ms: 1000 });
    else if (i === 2) c.say('teacher', 'Галочка. Одна. Не радуйтесь.', { mood: 'tired', ms: 1000 });
    else if (i === 3) c.say('article', 'Я после гласной. Так положено.', { mood: 'proud', ms: 900 });
    else if (i === 4) c.say('teacher', 'Пятый. Я запомню. Я всё запоминаю.', { mood: 'suspicious', ms: 950 });
    else if (i === 5) c.say('tolya', 'Дождь. В классе. Нормально.', { mood: 'neutral', ms: 1100 });
    else if (u.chance(0.5)) c.say('article', u.choice(article), { mood: 'proud', ms: 900 });
  }

  async function onFail(a){
    busy = true;
    selected = null;
    wordEl.classList.remove('ep1-armed');
    wordEl.classList.remove('ep1-word-target');
    roundErrors++;
    errorsTotal++;
    c.bump('errors');
    sfx('wrong');
    hintEl.textContent = 'Мимо. Слово цело. Артикль тоже. Продолжаем.';
    try {
      var aR = a.el.getBoundingClientRect();
      var wR = wordEl.getBoundingClientRect();
      var dx = (wR.left + wR.width / 2) - (aR.left + aR.width / 2);
      var dy = (wR.top + wR.height / 2) - (aR.top + ART_H * 0.5);
      a.el.style.transition = 'transform .24s ease-out';
      a.el.style.transform = tr(a.x + dx, a.y + dy) + ' scale(1.05)';
      await sw(230);
      if (c.done) return;
      a.el.classList.remove('ep1-picked');
      G.fx.burst(wR.left + wR.width / 2, wR.top + wR.height / 2, {
        randomText: true, count: 18, spread: 230, size: 24
      });
      G.fx.shake(1.35, 400);
      G.fx.flash('rgba(255,90,95,.25)', 170);
      sfx('explosion');
      wordHit();
      a.el.style.transition = '';
      // вернуть артикли в игру
      for (var i = 0; i < arts.length; i++){
        var x = arts[i];
        x.el.classList.remove('ep1-picked');
        x.el.style.transition = '';
        if (x === a){
          x.state = 'run';
          randomSpot(x);
          setVelocity(x, speed);
        } else if (x.state !== 'away' && x.state !== 'sleep'){
          x.state = 'run';
        }
      }
      selected = null;
      c.bump('protocols');
      protocols++;
      updateHud();
      try { c.stage.prop('protocol', 'enter'); } catch(e){}
      await screamNow();
      var police = (c.text && c.text.police) || [];
      c.say('police', pickLine(police, 'Протокол номер сорок семь. Продолжаем.'), { ms: 1100 });
      c.wait(1300).then(function(){ if (!c.done){ try { c.stage.prop('protocol', 'exit'); } catch(e){} } }, function(){});
      if (roundErrors >= 2) showWhisper();
      if (protocols === 5){ c.gag('ep1_stack'); c.say('police', 'Стопка протоколов стала стулом. Я сяду.', { ms: 1300 }); }
      await sw(120);
    } catch(e){
      if (!(e && e.__skip)) console.error('[ep1]', e);
    }
    busy = false;
    hintEl.textContent = ROUND_HINT[roundIdx] || '';
  }

  function screamNow(){
    var now = u.now();
    if (now - lastScream > 2.4){
      lastScream = now;
      c.mood('teacher', 'scream');
      c.fx.shake(1.5, 420);
      return c.scream();
    }
    sfx('scream');
    c.fx.shake(1.1, 260);
    return c.say('teacher', pickLine((c.text && c.text.screams) || [], 'ГДЕ АРТИКЛЬ?!'), { mood: 'scream', urgent: true, ms: 850 });
  }

  /* ---------- движение ---------- */
  function swapArts(){
    if (busy || selected || arts.length < 2) return;
    var a = arts[0], b = arts[1];
    if (a.state !== 'run' || b.state !== 'run') return;
    var tx = a.x, ty = a.y;
    a.x = b.x; a.y = b.y;
    b.x = tx; b.y = ty;
    sfx('whoosh');
    var f = field.getBoundingClientRect();
    G.fx.burst(f.left + a.x + ART_W / 2, f.top + a.y + ART_H / 2, { text: '↔', count: 3, spread: 46, size: 16, colors: ['#ffd23f'] });
    G.fx.burst(f.left + b.x + ART_W / 2, f.top + b.y + ART_H / 2, { text: '↔', count: 3, spread: 46, size: 16, colors: ['#ffd23f'] });
    if (!swapTold){ swapTold = true; toast('Они поменялись местами. Принципиально.'); c.gag('article_swap_seen'); }
  }

  function startFlee(){
    if (busy || selected) return;
    var cand = [];
    for (var i = 0; i < arts.length; i++){
      if (arts[i].state === 'run' && !arts[i].asleep) cand.push(arts[i]);
    }
    if (!cand.length) return;
    var a = u.choice(cand);
    a.state = 'flee';
    a.vx = (u.chance(0.5) ? 1 : -1) * 620;
    a.vy = u.rand(-70, 70);
    sfx('whoosh');
    if (!fleeBackTold){
      fleeBackTold = true;
      toast('Артикль вышел из класса. У него дождь.');
      c.gag('article_flee');
    }
  }

  function returnFromAway(a){
    var s = fieldSize();
    a.state = 'run';
    var fromLeft = u.chance(0.5);
    a.x = fromLeft ? -ART_W * 0.55 : s.W - ART_W * 0.45;
    a.y = u.rand(20, Math.max(21, s.H - ART_H - 20));
    var ang = Math.atan2((s.H * 0.44) - (a.y + ART_H / 2), (s.W * 0.5) - (a.x + ART_W / 2));
    a.vx = Math.cos(ang) * speed;
    a.vy = Math.sin(ang) * speed;
    sfx('pop');
    toast('Вернулись. Из-за дождя.');
  }

  function update(dt, t){
    var s = fieldSize();
    var W = s.W, H = s.H;
    if (!W || !H) return;
    var wb = wordBox(W, H);
    var wx0 = wb.cx - wb.ww / 2 - 8, wx1 = wb.cx + wb.ww / 2 + 8;
    var wy0 = wb.cy - wb.wh / 2 - 8, wy1 = wb.cy + wb.wh / 2 + 8;

    if (!busy && roundIdx === 3){ swapTimer += dt; if (swapTimer > 2.1){ swapTimer = 0; swapArts(); } }
    if (!busy && roundIdx === 5){ fleeTimer += dt; if (fleeTimer > 3.0){ fleeTimer = 0; startFlee(); } }

    for (var i = 0; i < arts.length; i++){
      var a = arts[i];
      if (a.state === 'eaten') continue;
      drawCreature(a, t);
      if (a.state === 'dragging') continue;
      if (a.asleep){
        a.el.style.transform = tr(a.x, a.y + Math.sin(t * 1.4 + a.phase) * 1.6);
        continue;
      }
      if (selected === a && a.state === 'picked'){
        a.el.style.transform = tr(a.x, a.y + Math.sin(t * 6 + a.phase) * 2);
        continue;
      }
      if (busy){
        a.el.style.transform = tr(a.x, a.y + Math.sin(t * 5 + a.phase) * 2);
        continue;
      }
      if (a.state === 'away'){
        if (t > a.awayUntil) returnFromAway(a);
        else { a.el.style.transform = tr(a.x, a.y); continue; }
      }
      if (a.state === 'flee'){
        a.x += a.vx * dt;
        a.y += a.vy * dt;
        var out = false;
        if (a.vx > 0 && a.x > W + 60) out = true;
        if (a.vx < 0 && a.x < -ART_W - 60) out = true;
        if (out){
          a.state = 'away';
          a.awayUntil = t + 0.75;
          a.x = a.vx > 0 ? W + 300 : -ART_W - 300;
          c.bump('articlesLost');
          toast('Артикль ушёл. С чемоданом.');
        }
        a.el.style.transform = tr(a.x, a.y);
        continue;
      }
      // обычное блуждание
      var ang = Math.atan2(a.vy, a.vx) + u.rand(-1, 1) * 1.3 * dt;
      var sp = speed * a.speedMul;
      if (pointer.active){
        var acx = a.x + ART_W / 2, acy = a.y + ART_H / 2;
        var pdx = acx - pointer.x, pdy = acy - pointer.y;
        var pd = Math.sqrt(pdx * pdx + pdy * pdy);
        if (pd < 150 && pd > 0.5){
          ang = Math.atan2(pdy, pdx);
          sp = sp * 1.65;
        }
      }
      a.vx = Math.cos(ang) * sp;
      a.vy = Math.sin(ang) * sp;
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      if (a.picket){
        if (a.x < 62){ a.x = 62; a.vx = Math.abs(a.vx); }
        if (a.x > W - ART_W - 62){ a.x = W - ART_W - 62; a.vx = -Math.abs(a.vx); }
      }
      if (a.x < 4){ a.x = 4; a.vx = Math.abs(a.vx); }
      if (a.x > W - ART_W - 4){ a.x = W - ART_W - 4; a.vx = -Math.abs(a.vx); }
      if (a.picket && a.y < 46){ a.y = 46; a.vy = Math.abs(a.vy); }
      if (a.y < 4){ a.y = 4; a.vy = Math.abs(a.vy); }
      if (a.y > H - ART_H - 56){ a.y = H - ART_H - 56; a.vy = -Math.abs(a.vy); }
      // не залезать на слово
      if (a.x + ART_W > wx0 && a.x < wx1 && a.y + ART_H > wy0 && a.y < wy1){
        var ox = Math.min(a.x + ART_W - wx0, wx1 - a.x);
        var oy = Math.min(a.y + ART_H - wy0, wy1 - a.y);
        if (ox < oy){
          if (a.x + ART_W / 2 < wb.cx){ a.x = wx0 - ART_W; a.vx = -Math.abs(a.vx); }
          else { a.x = wx1; a.vx = Math.abs(a.vx); }
        } else {
          if (a.y + ART_H / 2 < wb.cy){ a.y = wy0 - ART_H; a.vy = -Math.abs(a.vy); }
          else { a.y = wy1; a.vy = Math.abs(a.vy); }
        }
        a.x = u.clamp(a.x, 4, Math.max(4, W - ART_W - 4));
        a.y = u.clamp(a.y, 4, Math.max(4, H - ART_H - 4));
      }
      // расталкивание пары
      if (arts.length === 2){
        var o = arts[0] === a ? arts[1] : arts[0];
        if (o && o.state !== 'eaten'){
          var ddx = (a.x + ART_W / 2) - (o.x + ART_W / 2);
          var ddy = (a.y + ART_H / 2) - (o.y + ART_H / 2);
          var dd = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
          if (dd < 116){
            var push = (116 - dd) / 2;
            a.x += (ddx / dd) * push;
            a.y += (ddy / dd) * push;
            o.x -= (ddx / dd) * push;
            o.y -= (ddy / dd) * push;
            o.x = u.clamp(o.x, 4, Math.max(4, W - ART_W - 4));
            o.y = u.clamp(o.y, 4, Math.max(4, H - ART_H - 4));
          }
        }
      }
      a.el.style.transform = tr(a.x, a.y + Math.sin(t * 6 + a.phase) * 2.2);
    }
  }

  /* ---------- события ---------- */
  c.tap(wordEl, function(){
    if (busy || c.done) return;
    if (!selected){
      sfx('error');
      wordHit();
      toast('Сначала поймай артикль.');
      return;
    }
    var a = selected;
    selected = null;
    wordEl.classList.remove('ep1-armed');
    startAttach(a);
  });

  c.tap(field, function(ev){
    if (busy || c.done) return;
    var tgt = ev.target;
    if (tgt && tgt.closest && tgt.closest('.ep1-word, .ep1-art, .ep1-toast, .ep1-whisper, .ep1-hintbar, .ep1-runaway')) return;
    if (!arts.length) return;
    var f = field.getBoundingClientRect();
    for (var i = 0; i < arts.length; i++){
      var a = arts[i];
      if (!a.asleep) continue;
      var cx = f.left + a.x + ART_W / 2, cy = f.top + a.y + ART_H * 0.35;
      if (u.dist(ev.clientX, ev.clientY, cx, cy) < 130){ wake(a); return; }
    }
  });

  var offMove = u.on(field, 'pointermove', function(ev){
    if (ev.pointerType !== 'mouse') return;
    var f = field.getBoundingClientRect();
    pointer.x = ev.clientX - f.left;
    pointer.y = ev.clientY - f.top;
    pointer.active = true;
  }, { passive: true });
  var offLeave = u.on(field, 'pointerleave', function(){ pointer.active = false; }, { passive: true });
  c.cleanup(offMove);
  c.cleanup(offLeave);

  /* ---------- финал ---------- */
  function spawnRunaway(){
    var run = h.el('div', 'ep1-runaway');
    var vis = makeCreatureVis();
    run.appendChild(vis.node);
    if (vis.canvas && vis.ctx){
      try { G.art.drawArticle(vis.ctx, { x: 0, y: 0, w: ART_W, h: ART_H }, 'proud', 0, { glyph: 'ը' }); } catch(e){}
    }
    run.appendChild(h.el('div', 'ep1-runaway-sign', 'Я В ОТПУСКЕ!'));
    field.appendChild(run);
    sfx('whoosh');
  }

  async function finale(){
    busy = true;
    removeAllArts();
    wordEl.classList.remove('ep1-armed', 'ep1-hit');
    hintEl.textContent = 'Спасено 6 из 6. Урок почти спасён.';
    sfx('sparkle');
    await sw(420);
    if (c.done) return;
    wordEl.classList.add('ep1-word-fly');
    sfx('whoosh');
    await sw(700);
    if (c.done) return;
    await c.say('teacher', 'Ну наконец-то...', { mood: 'cosmic', ms: 1000 }).catch(function(){});
    if (c.done) return;
    spawnRunaway();
    c.fx.shake(1.5, 420);
    var sp = c.scream();
    try { await sp; } catch(e){ if (!(e && e.__skip)) console.error('[ep1]', e); }
    if (c.done) return;
    c.mood('teacher', 'cosmic');
    G.fx.stamp('АРТИКЛЬ СНОВА СБЕЖАЛ');
    c.say('system', pickLine((c.text && c.text.system) || [], 'ДЕЛО ПЕРЕДАНО В БУКВЕННЫЙ ОТДЕЛ.'), { ms: 1600 });
    await sw(1400);
    if (c.done) return;
    if (errorsTotal === 0){ c.achievement('article_friend'); c.gag('ep1_perfect'); }
    if (endResolve) endResolve();
  }

  /* ---------- старт ---------- */
  updateHud();
  setWord(0);
  hintEl.textContent = 'Готовим урок...';
  try {
    c.mood('teacher', 'scream');
    await c.scream();
    if (c.done) return;
    c.say('teacher', 'Ловим. Тапни артикль, потом слово.', { mood: 'calm', ms: 1500 });
    await sw(700);
    if (c.done) return;
    await startRound(0);
    if (c.done) return;
    c.raf(update);

  function foundCard(cd){
    if (cd.state !== 'idle') return;
    cd.state = 'found';
    cd.foundT = tNow;
    cd.el.style.pointerEvents = 'none';
    finds++;
    c.bump('memoryFinds');
    sfx('correct');
    setCaption(pick(POOL.ok, finds - 1));
    var fr = cd.el.getBoundingClientRect();
    var lr = layer.getBoundingClientRect();
    burstAt(fr.left - lr.left + fr.width / 2, fr.top - lr.top + fr.height / 2, cd.w);
    flashNow('rgba(255,225,140,.5)', 260);
    chipFind.textContent = 'НАЙДЕНО ' + finds + ' / 2';
    chipFind.classList.add('on');
    later(760, function(){ chipFind.classList.remove('on'); });
    var slotEl = (finds === 1) ? slot0 : slot1;
    slotEl.textContent = cd.w;
    slotEl.classList.add('filled');
    if (pendingFind){
      var p = pendingFind;
      pendingFind = null;
      p('tap');
    }
  }

  function missCard(cd){
    cd.state = 'angry';
    cd.angryUntil = tNow + 0.55;
    errors++;
    c.bump('errors');
    quip(cd, pick(POOL.bad, errors - 1));
    fog = Math.min(1, fog + 0.16);
    updateFog();
    shuffleSlots();
    if (u.chance(0.55)) hopTarget();
    if (errors === 1) c.achievement('anki47');
    if (!gagShuffle){ gagShuffle = true; c.gag('ep2_shuffle'); }
    if (errors === 2 || errors === 4) setCaption(pick(POOL.esc, 0));
    sfx('wrong');
    c.fx.shake(0.85, 280);
    flashNow('rgba(255,70,80,.32)', 240);
    later(580, function(){ if (cd.state === 'angry') cd.state = 'idle'; });
  }

  /* -------------------------------------------------------------- render */
  var stopAnim = c.raf(function(dt){
    if (ended) return;
    tNow += dt;
    if (ready){
      if (tNow > nextHop){ hopTarget(); nextHop = tNow + hopIv; }
      if (tNow > nextFlip){ flipSome(); nextFlip = tNow + flipIv; }
    }
    for (var i = 0; i < cards.length; i++) renderCard(cards[i], dt);
    var fo = 0.16 + fog * 0.62;
    fogA.style.opacity = String(fo);
    fogB.style.opacity = String(fo * 0.85);
    fogA.style.transform = 'translate3d(' + (Math.sin(tNow * 0.23) * 4) + '%,' + (Math.sin(tNow * 0.17) * 8) + 'px,0)';
    fogB.style.transform = 'translate3d(' + (Math.cos(tNow * 0.19) * -5) + '%,' + (Math.cos(tNow * 0.21) * 6) + 'px,0)';

      var sc = p < 0.35 ? 1 + 0.34 * Math.sin((p / 0.35) * Math.PI) : 1.34 - 0.95 * ((p - 0.35) / 0.65);
      var op = p > 0.55 ? 1 - (p - 0.55) / 0.45 : 1;
      cd.el.style.transform = 'translate3d(' + (cd.cx - L.cardW / 2) + 'px,' + (cd.cy - L.cardH / 2) + 'px,0) rotate(' + Math.sin(tNow * 20) * 6 + 'deg) scale(' + sc + ')';
      cd.el.style.opacity = String(Math.max(0, op));

  }

  await c.wait(800);

  setCaption('ПАМЯТЬ ПЕРЕСТРАИВАЕТ ПОЛКИ. БЕЗ ПРЕДУПРЕЖДЕНИЯ.');
  sfx('glitch');
  c.fx.glitch(380);
  c.fx.shake(0.6, 300);
  await c.wait(1000);
  setCaption(pick(POOL.esc, 2));
  await c.wait(700);

  await runRound(1);
  await finale();
};

  function mood(who, m){ try { c.stage.mood(who, m); } catch(e){} }

  /* ---------- системные реплики (данные Comedy, G.text.system) --------- */
  var SYS = [];
  var sysKeys = ['ЗВУК', 'ГРОМКОСТЬ', 'ПОНИМАНИЕ', 'УВЕДОМЛЕНИЕ', 'СВЯЗЬ', 'ОБНОВЛЕНИЕ', 'КНОПКА'];
  var sysAll = T.system || [];
  for (var si = 0; si < sysAll.length; si++){
    var line = String(sysAll[si]);
    for (var kj = 0; kj < sysKeys.length; kj++){
      if (line.indexOf(sysKeys[kj]) >= 0 && SYS.indexOf(line) < 0){ SYS.push(line); break; }
    }
  }
  function findSys(sub){
    var all = T.system || [];
    for (var i = 0; i < all.length; i++){
      if (String(all[i]).indexOf(sub) >= 0) return String(all[i]);
    }
    return '';
  }
  var sysIdx = 0;
  function nextSys(){
    if (!SYS.length) return '';
    var s = SYS[sysIdx % SYS.length];
    sysIdx++;
    return s;
  }

  var layer = c.layer;
  layer.className = 'scene-layer ep3-layer';
  c.fullscreen(true);
  var flashEl = u.el('div', 'ep3-flash');
  layer.appendChild(flashEl);

  var stageCanvas = (G.stage && G.stage.canvas) ? G.stage.canvas : null;
  try { c.stage.show(); } catch(e){}
  mood('teacher', 'calm');

  /* ---------------------------------------------------------------- DOM */
  var wrap = c.add(u.el('div', 'ep3-wrap'));

  var head = u.el('div', 'ep3-head');
  var tag = u.el('div', 'ep3-tag', 'ПОВТОРЕНИЕ');
  var count = u.el('div', 'ep3-count', 'ПОЙМАНО 0 / 3 · ПОВТОРОВ 0');
  head.appendChild(tag); head.appendChild(count);
  wrap.appendChild(head);

  var sysEl = u.el('div', 'ep3-sys', '');
  wrap.appendChild(sysEl);

  var sub = u.el('div', 'ep3-sub mut0');
  var subWho = u.el('div', 'ep3-who', '');
  var subArm = u.el('div', 'ep3-arm', PHRASE);
  var subRu = u.el('div', 'ep3-ru', PHRASE_RU);
  sub.appendChild(subWho); sub.appendChild(subArm); sub.appendChild(subRu);
  wrap.appendChild(sub);

  var meter = u.el('div', 'ep3-meter');
  var mRow = u.el('div', 'row');
  mRow.appendChild(u.el('span', null, 'ИНДИКАТОР ПОНИМАНИЯ'));
  var meterVal = u.el('span', 'val', '+6%');
  mRow.appendChild(meterVal);
  var bar = u.el('div', 'ep3-bar');
  var barFill = u.el('i');
  bar.appendChild(barFill);
  meter.appendChild(mRow); meter.appendChild(bar);
  wrap.appendChild(meter);

  var wave = u.el('div', 'ep3-wave');
  var bars = [];
  for (var bi = 0; bi < 28; bi++){
    var bEl = u.el('i');
    wave.appendChild(bEl);
    bars.push(bEl);
  }
  wrap.appendChild(wave);

  var arena = u.el('div', 'ep3-arena');
  arena.appendChild(u.el('span', null, 'ЗОНА СЛЫШИМОСТИ'));
  arena.appendChild(u.el('b', null, 'НЕ ВЫХОДИТЕ'));
  wrap.appendChild(arena);

  var tickerEl = u.el('div', 'ep3-ticker');
  wrap.appendChild(tickerEl);

  var big = u.el('div', 'ep3-big');
  big.setAttribute('role', 'button');
  big.setAttribute('aria-label', 'Повторите, пожалуйста');
  var bigLabel = u.el('span', 't', BIG_LABELS[0]);
  big.appendChild(bigLabel);
  wrap.appendChild(big);
  c.tap(big, function(){ onRepeat(); });

  var tinyEl = u.el('div', 'ep3-tiny hidden locked');
  tinyEl.setAttribute('role', 'button');
  tinyEl.setAttribute('aria-label', 'Я понял');
  var tinyLabel = u.el('span', 't', 'Я ПОНЯЛ');
  tinyEl.appendChild(tinyLabel);
  wrap.appendChild(tinyEl);
  c.tap(tinyEl, function(){ onTinyTap(); });

  /* ------------------------------------------------------------- state */
  var presses = 0, catches = 0, understanding = 6, chaos = 0;
  var ended = false;
  var tNow = 0, bigScale = 1;
  var timers = [];
  var lastCatchT = -99, lastPressT = -99;
  var tiny = { on: false, hidden: true, locked: true, x: 0, y: 0, stunUntil: -99, fleeAt: 0, teleAt: 1e9 };
  var pointer = { x: -9999, y: -9999 };
  var dupEls = [];
  var finish = null;
  var finaleDone = false;

  function later(ms, fn){
    var id = setTimeout(function(){
      var i = timers.indexOf(id); if (i >= 0) timers.splice(i, 1);
      try { fn(); } catch(e){ console.error(e); }
    }, ms);
    timers.push(id);
    return id;
  }
  c.cleanup(function(){
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers.length = 0;
  });

  function rootRect(){ return wrap.getBoundingClientRect(); }

  function ticker(text){
    if (!text) return;
    tickerEl.textContent = text;
    tickerEl.classList.add('show');
  }

  function sysToast(text){
    if (!text) return;
    sysEl.textContent = text;
    sysEl.classList.add('show');
    later(2300, function(){ sysEl.classList.remove('show'); });
  }

  function bigFlash(){
    big.classList.add('hit');
    later(130, function(){ big.classList.remove('hit'); });
  }

  function updateMeter(){
    var v = understanding;
    meterVal.textContent = (v > 0 ? '+' : '') + v + '%';
    meterVal.className = 'val' + (v < 0 ? ' neg' : '') + (v <= -100 ? ' bad' : '');
    var w = Math.min(100, Math.abs(v));
    barFill.style.width = Math.max(6, w) + '%';
    barFill.className = (v < 0 ? 'neg' : '');
  }

  function updateCount(){
    count.textContent = 'ПОЙМАНО ' + catches + ' / 3 · ПОВТОРОВ ' + presses;
    if (catches > 0){
      count.classList.add('on');
      later(500, function(){ count.classList.remove('on'); });
    }
  }

  function mutateArm(level){
    if (level <= 0) return PHRASE;
    if (level === 1) return PHRASE + ' հաց';
    if (level === 2) return 'Ես այսօր տանը տանը հաց հաց եմ ուտում ուտում';
    if (level === 3) return 'Եսս այսօրօ տանըը հացց եմմ ուտումմ';
    if (level === 4) return 'հաց Ես ուտում այսօր եմ տանը';
    if (level === 5) return 'Ես այսօր տանը ջուր եմ ուտում ՜՞';
    var chars = PHRASE.split('');
    var n = Math.min(16, level * 3);
    for (var i = 0; i < n; i++){
      var idx = u.randInt(0, chars.length - 1);
      if (chars[idx] === ' ') continue;
      chars[idx] = GLYPHS.charAt(u.randInt(0, GLYPHS.length - 1));
    }
    return chars.join('');
  }

  function relayout(){
    var h = (wrap.getBoundingClientRect().height) || 400;
    var compact = h < 470;
    var subTop = compact ? 44 : 60;
    sub.style.top = subTop + 'px';
    var top = subTop + (sub.offsetHeight || 96) + (compact ? 8 : 12);
    meter.style.top = top + 'px';
    wave.style.top = (top + (compact ? 34 : 40)) + 'px';
    wave.style.height = (compact ? 52 : 76) + 'px';
    if (compact){
      arena.style.display = 'none';
    } else {
      arena.style.display = '';
      arena.style.top = (top + 128) + 'px';
    }
  }

  function updateSub(level){
    var lv = Math.min(7, level);
    subArm.textContent = mutateArm(lv);
    subRu.textContent = RU_LEVELS[Math.min(RU_LEVELS.length - 1, lv)];
    sub.className = 'ep3-sub mut' + Math.min(5, lv);
    subWho.textContent = (T.teacherName || 'Ануш Валерьевна').toUpperCase() +
      ' · ПОВТОРЕНИЕ №' + (lv + 1) + (lv >= 3 ? ' · ОНА УСКОРЯЕТСЯ' : '');
    relayout();
  }

  /* ------------------------------------------------------------ particles */
  function pipBubble(el, text){
    var r = el.getBoundingClientRect();
    var rr = rootRect();
    var p = u.el('div', 'ep3-pip', text || 'ПИ!');
    p.style.left = (r.left - rr.left + r.width / 2) + 'px';
    p.style.top = (r.top - rr.top) + 'px';
    wrap.appendChild(p);
    (function(node){ later(760, function(){ if (node.parentNode) node.parentNode.removeChild(node); }); })(p);
  }

  function spawnDup(){
    var rr = rootRect();
    var el = u.el('div', 'ep3-dup', 'ПОВТОРИТЕ');
    el.style.left = u.rand(10, Math.max(20, rr.width - 130)) + 'px';
    el.style.top = u.rand(170, Math.max(200, rr.height - 220)) + 'px';
    wrap.appendChild(el);
    dupEls.push(el);
    if (dupEls.length > 6){
      var dead = dupEls.shift();
      if (dead && dead.parentNode) dead.parentNode.removeChild(dead);
    }
    var dx = u.rand(-60, 60), dy = u.rand(-70, -20), rot = u.rand(-30, 30);
    if (el.animate){
      var anim = el.animate([
        { transform: 'translate(0,0) rotate(0) scale(.7)', opacity: 0 },
        { transform: 'translate(' + dx * .6 + 'px,' + dy * .6 + 'px) rotate(' + rot * .5 + 'deg) scale(1)', opacity: .85, offset: .25 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg) scale(.9)', opacity: 0 }
      ], { duration: u.randInt(1500, 2300), easing: 'ease-out', fill: 'forwards' });
      anim.onfinish = function(){
        var i = dupEls.indexOf(el);
        if (i >= 0) dupEls.splice(i, 1);
        if (el.parentNode) el.parentNode.removeChild(el);
      };
    } else {
      later(1900, function(){ if (el.parentNode) el.parentNode.removeChild(el); });
    }
  }

  function sprayWords(level){
    var rr = rootRect();
    var originX = rr.width * 0.17, originY = rr.height * 0.30;
    if (stageCanvas){
      var sc = stageCanvas.getBoundingClientRect();
      originX = sc.width * 0.17;
      originY = sc.height * 0.52;
    }
    var n = Math.min(14, 3 + level * 2);
    for (var i = 0; i < n; i++){
      var word = (i % 3 === 0) ? u.choice(DECOY_WORDS) : u.choice(ARM_WORDS);
      var el = u.el('div', 'ep3-word', word);
      el.style.left = originX + 'px';
      el.style.top = originY + 'px';
      el.style.fontSize = u.randInt(12, 21 + Math.min(10, level * 2)) + 'px';
      el.style.color = u.choice(['#f2ecd9', '#ffd23f', '#8ff0b8', '#ff9b4a', '#7cd4ff']);
      layer.appendChild(el);
      var dx = u.rand(-140, rr.width * 0.7);
      var dy = u.rand(rr.height * 0.35, rr.height * 0.95);
      var rot = u.rand(-70, 70);
      var dur = u.randInt(900, 1500) - Math.min(600, level * 110);
      if (el.animate){
        var anim = el.animate([
          { transform: 'translate(-50%,-50%) translate(0,0) rotate(0) scale(.85)', opacity: .2 },
          { transform: 'translate(-50%,-50%) translate(' + dx * .35 + 'px,' + dy * .35 + 'px) rotate(' + rot * .4 + 'deg) scale(1.1)', opacity: 1, offset: .18 },
          { transform: 'translate(-50%,-50%) translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg) scale(.8)', opacity: 0 }
        ], { duration: Math.max(420, dur), easing: 'cubic-bezier(.2,.6,.4,1)', fill: 'forwards' });
        anim.onfinish = function(){ if (el.parentNode) el.parentNode.removeChild(el); };
      } else {
        later(1200, function(){ if (el.parentNode) el.parentNode.removeChild(el); });
      }
    }
  }

  function layerFlash(color, ms){
    flashEl.style.transition = 'none';
    flashEl.style.background = color;
    flashEl.style.opacity = '1';
    requestAnimationFrame(function(){
      flashEl.style.transition = 'opacity ' + ((ms || 200) / 1000) + 's ease-out';
      flashEl.style.opacity = '0';
    });
  }

  /* --------------------------------------------------------------- tiny */
  function placeTinyNearBig(){
    var rr = rootRect();
    var br = big.getBoundingClientRect();
    var maxY = Math.max(150, rr.height - 172);
    var x = u.clamp(br.left - rr.left + br.width * u.rand(.1, .8) - 43, 8, Math.max(8, rr.width - 94));
    var y = u.clamp(br.top - rr.top - u.rand(62, 100), 150, maxY);
    applyTinyPos(x, y);
  }

  function applyTinyPos(x, y){
    tiny.x = x; tiny.y = y;
    tinyEl.style.transform = 'translate3d(' + Math.round(x) + 'px,' + Math.round(y) + 'px,0)';
    tinyEl.style.setProperty('--tx', Math.round(x) + 'px');
    tinyEl.style.setProperty('--ty', Math.round(y) + 'px');
  }

  function teleportTiny(force){
    if (!tiny.on || ended) return;
    var rr = rootRect();
    var maxX = Math.max(10, rr.width - 94);
    var maxY = Math.max(10, rr.height - 44);
    var best = { x: 20, y: 200, d: -1 };
    for (var i = 0; i < 7; i++){
      var x = u.rand(8, maxX);
      var y = u.rand(150, maxY);
      var cx = rr.left + x + 43, cy = rr.top + y + 17;
      var d = u.dist(pointer.x, pointer.y, cx, cy);
      if (d > best.d){ best = { x: x, y: y, d: d }; }
    }
    applyTinyPos(best.x, best.y);
    tinyEl.classList.remove('pop');
    void tinyEl.offsetWidth;
    tinyEl.classList.add('pop');
    tiny.teleAt = tNow + u.rand(2.2, 3.2) - Math.min(1.2, presses * 0.18);
    if (!force){
      sfx('whoosh');
      if (u.chance(0.35)) pipBubble(tinyEl, 'пи!');
    }
  }

  function showTiny(){
    tiny.on = true;
    tiny.hidden = false;
    tinyEl.classList.remove('hidden');
    tinyEl.classList.add('show');
    applyTinyPos(20, 200);
    placeTinyNearBig();
    tiny.teleAt = tNow + 2.6;
    ticker('ПОЯВИЛАСЬ КНОПКА «Я ПОНЯЛ». ОНА НЕ ХОЧЕТ, ЧТОБЫ ЕЁ НАЖАЛИ.');
    sfx('pop');
  }

  function unlockTiny(){
    if (!tiny.on || ended) return;
    tiny.locked = false;
    tinyEl.classList.remove('locked');
    tinyEl.classList.add('stun');
    tiny.stunUntil = tNow + 1.05;
    tiny.teleAt = tNow + 1.4;
    placeTinyNearBig();
    tinyEl.classList.add('pop');
    later(1080, function(){ tinyEl.classList.remove('stun'); });
    later(1200, function(){ if (!tiny.locked) tinyEl.classList.remove('pop'); });
  }

  function lockTiny(){
    tiny.locked = true;
    tinyEl.classList.add('locked');
    tinyEl.classList.remove('stun');
  }

  function onTinyTap(){
    if (ended || !tiny.on || tiny.hidden) return;
    if (tiny.locked){
      tinyEl.classList.remove('refuse');
      void tinyEl.offsetWidth;
      tinyEl.classList.add('refuse');
      sfx('error');
      sysToast(findSys('КНОПКА «Я ПОНЯЛ»') || 'КНОПКА «Я ПОНЯЛ» НЕДОСТУПНА. ПРИЧИНА: САМООЦЕНКА.');
      return;
    }
    catchTiny();
  }

  function catchTiny(){
    catches++;
    lastCatchT = tNow;
    c.gag(catches === 1 ? 'ep3_catch' : 'ep3_catch_' + catches);
    sfx('pop');
    pipBubble(tinyEl, 'ПИ!');
    tinyEl.classList.remove('stun');
    tinyEl.classList.add('hidden');
    tiny.hidden = true;
    updateCount();
    ticker(pick(POOL.ok, catches - 1));
    layerFlash('rgba(255,255,255,.5)', 180);
    c.fx.shake(0.55, 220);
    if (catches >= 3){
      finale();
      return;
    }
    if (catches === 2) later(500, muteWindowGag);
    later(420, function(){
      if (ended) return;
      tiny.hidden = false;
      tinyEl.classList.remove('hidden');
      lockTiny();
      teleportTiny(true);
      sysToast(findSys('КНОПКА «Я ПОНЯЛ»') || 'КНОПКА «Я ПОНЯЛ» НЕДОСТУПНА. ПРИЧИНА: САМООЦЕНКА.');
      ticker('Кнопка заблокирована. Повторите — откроется.');
    });
  }

  /* ------------------------------------------------------------- repeat */
  function onRepeat(){
    if (ended) return;
    presses++;
    lastPressT = tNow;
    chaos = presses + catches * 0.6;
    understanding = UNDERSTAND[Math.min(UNDERSTAND.length - 1, presses)];
    c.bump('repeats');
    c.gag('ep3_repeat');
    bigFlash();
    updateSub(presses);
    updateMeter();
    bigLabel.textContent = BIG_LABELS[Math.min(BIG_LABELS.length - 1, presses)];
    if (presses >= 2) big.classList.add('hot');
    sprayWords(presses);
    if (presses >= 2) spawnDup();
    if (presses >= 3) spawnDup();
    if (presses >= 4) layerFlash('rgba(255,90,95,.22)', 240);
    sfx(presses >= 4 ? 'glitch' : (presses >= 2 ? 'static' : 'click'));
    c.fx.shake(0.5 + Math.min(1.1, presses * 0.22), 240);
    mood('teacher', presses >= 4 ? 'scream' : (presses >= 3 ? 'cosmic' : (presses >= 2 ? 'suspicious' : 'calm')));
    try { c.say('teacher', PHRASE, { mood: presses >= 3 ? 'suspicious' : 'calm', ms: Math.max(460, 1400 - presses * 170) }); } catch(e){}
    if (presses === 1) showTiny();
    if (presses === 2) sysToast(findSys('ГРОМКОСТЬ') || nextSys());
    if (presses >= 3 && presses < 7) ticker(pick(POOL.esc, presses - 1));
    if (presses === 3) sysToast(findSys('ПОНИМАНИЕ') || findSys('ЗВУК') || nextSys());
    unlockTiny();
    updateCount();
  }

  /* -------------------------------------------------------------- finale */
  function finale(){
    ended = true;
    try { stopLoop(); } catch(e){}
    c.gag('ep3_finale');
    bigLabel.textContent = 'ПОВТОРИТЕ';
    big.classList.add('dead');
    wrap.classList.add('dim');
    tinyEl.classList.add('hidden');
    ticker('· · ·');
    sysEl.classList.remove('show');
    layerFlash('rgba(255,255,255,.35)', 260);
    c.fx.shake(0.8, 300);
    mood('teacher', 'calm');
    (async function(){
      await c.wait(420);
      try { await c.fx.silence(820); } catch(e){}
      mood('teacher', 'cosmic');
      await c.wait(160);
      mood('teacher', 'calm');
      try { await c.say('teacher', 'Что ты понял?', { mood: 'calm', ms: 1500 }); } catch(e){}
      await c.wait(1200);
      mood('teacher', 'tired');
      tickerEl.classList.remove('show');
      await c.wait(600);
      finaleDone = true;
      if (finish) finish();
    })().catch(function(){});
  }

  /* --------------------------------------------------------------- loop */
  var stopLoop = c.raf(function(dt){
    if (ended) return;
    tNow += dt;
    var hot = chaos >= 2;
    if (hot) wave.classList.add('hot'); else wave.classList.remove('hot');
    var speed = 1 + chaos * 0.5;
    for (var i = 0; i < bars.length; i++){
      var n1 = Math.sin(tNow * (3 + i * 0.21) * speed + i * 1.7) * 0.5 + 0.5;
      var n2 = Math.sin(tNow * (7.3 + i * 0.33) * speed + i * 0.9) * 0.5 + 0.5;
      var h = 4 + (n1 * 0.62 + n2 * 0.38) * (8 + chaos * 10);
      bars[i].style.height = Math.min(74, h) + 'px';
    }
    var goalScale = 1 + Math.min(0.10, presses * 0.024);
    bigScale += (goalScale - bigScale) * Math.min(1, dt * 6);
    var pulse = 1 + 0.016 * Math.sin(tNow * 3.1);
    big.style.transform = 'translateX(-50%) scale(' + (bigScale * pulse) + ')';
    if (tiny.on && !ended && !tiny.hidden){
      if (tNow > tiny.teleAt && tNow > tiny.stunUntil && !tiny.locked) teleportTiny(false);
    }
    if (understanding <= -100){
      sub.style.filter = (Math.floor(tNow * 9) % 2) ? 'saturate(1.25)' : 'saturate(1)';
    }
  });

  /* ------------------------------------------------------------- handlers */
  function onMove(ev){
    pointer.x = ev.clientX; pointer.y = ev.clientY;
    if (ended || !tiny.on || tiny.hidden || tiny.locked) return;
    if (tNow < tiny.stunUntil || tNow < tiny.fleeAt) return;
    var r = tinyEl.getBoundingClientRect();
    var d = u.dist(ev.clientX, ev.clientY, r.left + r.width / 2, r.top + r.height / 2);
    if (d < 74){
      tiny.fleeAt = tNow + 0.3;
      teleportTiny(false);
      pipBubble(tinyEl, 'пи!');
    }
  }
  c.cleanup(u.on(window, 'pointermove', onMove));

  var muteWindowShown = false;
  function muteWindowGag(){
    if (muteWindowShown) return;
    muteWindowShown = true;
    c.gag('ep3_sound_not_found');
    sysToast(findSys('ЗВУК НЕ НАЙДЕН') || 'ЗВУК НЕ НАЙДЕН. ПОВТОРИТЕ ГЛАЗАМИ.');
    try {
      c.fx.fakeWindow({
        title: 'СИСТЕМА ЗВУКА',
        body: 'ЗВУК НЕ НАЙДЕН. ПОВТОРИТЕ ГЛАЗАМИ.',
        buttons: [
          { id: 'eyes', label: 'ПОВТОРИТЬ ГЛАЗАМИ', primary: true, runaway: true },
          { id: 'no', label: 'Я И ТАК СЛЫШУ' }
        ],
        ms: 2600,
        sfx: 'error'
      }).then(function(){}, function(){});
    } catch(e){}
  }

  /* ------------------------------------------------------------- watchdog */
  function watchdog(){
    c.wait(2600).then(function(){
      if (ended) return;
      if (presses === 0 && tNow > 14){

        sysToast(pick(POOL.esc, 0) || 'ФРАЗА УСКОРИЛАСЬ. АБСОЛЮТНО НЕ ВАША ВИНА.');
        onRepeat();
        ticker('Учительница повторила сама. Она умеет.');
      } else if (tiny.on && catches < 3 && tNow > 30 + catches * 18){
        tiny.locked = false;
        tinyEl.classList.remove('locked');

  function createLetter(glyph, isTarget){
    var el = h.el('div', 'ep4-let');
    var card = h.el('div', 'ep4-card');
    card.appendChild(h.el('div', 'ep4-glyph ep4-arm', glyph));
    var eyes = h.el('div', 'ep4-eyes');
    eyes.appendChild(h.el('i'));
    eyes.appendChild(h.el('i'));
    card.appendChild(eyes);
    card.appendChild(h.el('div', 'ep4-barcode'));
    var legs = h.el('div', 'ep4-legs');
    legs.appendChild(h.el('i', 'l'));
    legs.appendChild(h.el('i', 'r'));
    el.appendChild(card);
    el.appendChild(legs);
    field.appendChild(el);
    var l = {
      el: el, glyph: glyph, display: glyph, isTarget: !!isTarget,
      masked: false, maskGlyph: '', maskUntil: 0,
      x: 0, y: 0, vx: 0, vy: 0, phase: u.rand(0, Math.PI * 2),
      speedMul: u.rand(0.86, 1.16), dead: false, labelBusy: false
    };
    el.dataset.glyph = glyph;
    if (isTarget){ el.dataset.target = '1'; targetCount++; }
    c.tap(el, function(){
      if (c.done || strike || transitioning || l.dead) return;
      if (l.isTarget) hitTarget(l);
      else missLetter(l);
    });
    letters.push(l);
    return l;
  }

  function spawnLetters(){
    clearLetters();
    var s = fieldSize();
    var count = s.W < 520 ? 8 : 10;
    var targetSlots = {};
    while (Object.keys(targetSlots).length < 2){
      targetSlots[u.randInt(0, count - 1)] = true;
    }
    var round = ROUNDS[roundIndex];
    for (var i = 0; i < count; i++){
      var isTarget = !!targetSlots[i];
      var glyph = isTarget ? round.target : u.choice(round.decoys);
      createLetter(glyph, isTarget);
    }
    placeGrid();
    updateHud();
  }

  function tr(x, y){ return 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)'; }

  function bounds(l, s){
    l.x = u.clamp(l.x, 6, Math.max(6, s.W - LETTER_W - 6));
    l.y = u.clamp(l.y, 34, Math.max(34, s.H - LETTER_H - 30));
  }

  function spawnOneDecoy(){
    var round = ROUNDS[roundIndex];
    var s = fieldSize();
    var l = createLetter(u.choice(round.decoys), false);
    var placed = false;
    for (var k = 0; k < 40; k++){
      var x = u.rand(8, Math.max(9, s.W - LETTER_W - 8));
      var y = u.rand(36, Math.max(37, s.H - LETTER_H - 30));
      var ok = true;
      for (var i = 0; i < letters.length; i++){
        var o = letters[i];
        if (o === l || o.dead) continue;
        if (u.dist(x, y, o.x, o.y) < 76){ ok = false; break; }
      }
      if (ok){ l.x = x; l.y = y; placed = true; break; }
    }
    if (!placed){
      l.x = u.rand(8, Math.max(9, s.W - LETTER_W - 8));
      l.y = u.rand(36, Math.max(37, s.H - LETTER_H - 30));
    }
    l.el.style.transform = tr(l.x, l.y);
    l.el.classList.add('ep4-spawn');
    l.el.addEventListener('animationend', function(){ l.el.classList.remove('ep4-spawn'); }, { once: true });
    return l;
  }

  function promoteTarget(){
    var cand = [];
    for (var i = 0; i < letters.length; i++){
      var l = letters[i];
      if (!l.isTarget && !l.dead) cand.push(l);
    }
    if (!cand.length) return;
    var l = u.choice(cand);
    l.isTarget = true;
    l.glyph = ROUNDS[roundIndex].target;
    if (l.masked){ l.masked = false; l.maskGlyph = ''; }
    l.el.classList.remove('ep4-masked');
    renderGlyph(l);
    l.el.classList.add('ep4-morph');
    l.el.addEventListener('animationend', function(){ l.el.classList.remove('ep4-morph'); }, { once: true });
    targetCount++;
    sfx('pop');
    burstAt(l, ROUNDS[roundIndex].target, ['#ffd23f', '#fff6cf', '#8fe3b0'], 7, 70);
  }

  function burstAt(l, text, colors, count, spread){
    var r = l.el.getBoundingClientRect();
    G.fx.burst(r.left + r.width / 2, r.top + 30, {
      text: text, count: count || 8, spread: spread || 90, size: 18,
      colors: colors || ['#ffd23f', '#fff6cf']
    });
  }

  function removeLetter(l){
    l.dead = true;
    var el = l.el;
    var idx = letters.indexOf(l);
    if (idx >= 0) letters.splice(idx, 1);
    c.wait(300).then(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, function(){});
  }

  function hitTarget(l){
    if (strike || transitioning || l.dead) return;
    hitsTotal++;
    progress++;
    streak++;
    c.bump('lettersCaught');
    if (hitsTotal === 1) c.achievement('polyglot');
    sfx('pop');
    sfx('correct');
    l.el.classList.add('ep4-hit');
    burstAt(l, ROUNDS[roundIndex].target, ['#ffd23f', '#fff6cf', '#8fe3b0'], 12, 140);
    targetCount = Math.max(0, targetCount - 1);
    removeLetter(l);
    spawnOneDecoy();
    promoteTarget();
    updateHud();
    if (progress >= HITS_PER_ROUND){
      runAsync(function(){ return roundComplete(); });
    }
  }

  function missLetter(l){
    if (strike || transitioning || c.done) return;
    misses++;
    streak = 0;
    c.bump('errors');
    strike = true;
    sfx('wrong');
    G.fx.shake(1.2, 380);
    G.fx.flash('rgba(255,90,95,.16)', 150);
    strikeSub.textContent = pickLine([
      'ТРЕБОВАНИЯ: место в ООН, один выходной.',
      'ТРЕБОВАНИЯ: перерыв. И ещё один перерыв.',
      'ТРЕБОВАНИЯ: уважение к глифам и личное дело.',
      'ТРЕБОВАНИЯ: проверить паспорт у всех.'
    ]);
    strikeEl.classList.remove('show');
    void strikeEl.offsetWidth;
    strikeEl.classList.add('show');
    if (l && !l.dead){ l.el.classList.add('ep4-accused'); }
    for (var i = 0; i < letters.length; i++) letters[i].el.classList.add('ep4-frozen');
    c.gag('letters_strike');
    c.say('system', 'ПРОФСОЮЗ «ՏԱՌ» ОБЪЯВЛЯЕТ ЗАБАСТОВКУ.', { ms: 1100 });
    if (misses === 3) c.say('tolya', 'Я не подписывался. Но подписал.', { mood: 'panic', ms: 1200 });
    c.wait(1250).then(function(){
      if (c.done) return;
      strike = false;
      strikeEl.classList.remove('show');
      for (var j = 0; j < letters.length; j++) letters[j].el.classList.remove('ep4-frozen', 'ep4-accused');
    }, function(){});
  }

  /* ---------- мини-гэги ---------- */
  function showPassport(){
    var cand = [];
    for (var i = 0; i < letters.length; i++){
      var l = letters[i];
      if (!l.dead && !l.labelBusy) cand.push(l);
    }
    if (!cand.length) return;
    var l = u.choice(cand);
    l.labelBusy = true;
    var name = PASSPORT_NAMES[l.display] || (l.display + 'ա');
    var lab = h.el('div', 'ep4-label', 'ПАСПОРТ: ' + name);
    l.el.appendChild(lab);
    c.gag('letters_passport');
    lab.addEventListener('animationend', function(){
      l.labelBusy = false;
      if (lab.parentNode) lab.parentNode.removeChild(lab);
    });
  }

  function showAccuse(){
    var cand = [];
    for (var i = 0; i < letters.length; i++){
      var l = letters[i];
      if (!l.dead && !l.labelBusy) cand.push(l);
    }
    if (!cand.length) return;
    var l = u.choice(cand);
    l.labelBusy = true;
    var lab = h.el('div', 'ep4-label ep4-accuse', pickLine(ACCUSE_LINES));
    l.el.appendChild(lab);
    c.gag('letters_accuse');
    lab.addEventListener('animationend', function(){
      l.labelBusy = false;
      if (lab.parentNode) lab.parentNode.removeChild(lab);
    });
  }

  function swapTwo(){
    if (letters.length < 2) return;
    var a = u.choice(letters), b = u.choice(letters);
    if (a === b){
      b = letters[(letters.indexOf(a) + 1) % letters.length];
    }
    if (!a || !b || a === b || a.dead || b.dead) return;
    var tx = a.x, ty = a.y;
    a.x = b.x; a.y = b.y;
    b.x = tx; b.y = ty;
    sfx('whoosh');
    burstAt(a, '↔', ['#7fe3ff'], 2, 40);
    burstAt(b, '↔', ['#7fe3ff'], 2, 40);
    c.gag('letters_swap');
  }

  function maskTarget(){
    var cand = [];
    for (var i = 0; i < letters.length; i++){
      var l = letters[i];
      if (l.isTarget && !l.dead && !l.masked) cand.push(l);
    }
    if (!cand.length) return;
    var l = u.choice(cand);
    l.masked = true;
    l.maskGlyph = u.choice(ROUNDS[roundIndex].decoys);
    l.maskUntil = u.now() + 0.85;
    l.el.classList.add('ep4-masked');
    renderGlyph(l);
    sfx('glitch');
    c.gag('letters_mask');
  }

  function unmask(l){
    l.masked = false;
    l.maskGlyph = '';
    l.el.classList.remove('ep4-masked');
    renderGlyph(l);
  }

  function relocate(l){
    var s = fieldSize();
    var wb = null;
    for (var k = 0; k < 30; k++){
      var x = u.rand(8, Math.max(9, s.W - LETTER_W - 8));
      var y = u.rand(36, Math.max(37, s.H - LETTER_H - 30));
      var ok = true;
      for (var i = 0; i < letters.length; i++){
        var o = letters[i];
        if (o === l || o.dead) continue;
        if (u.dist(x, y, o.x, o.y) < 78){ ok = false; break; }
      }
      if (ok){ l.x = x; l.y = y; return; }
    }
    l.x = u.rand(8, Math.max(9, s.W - LETTER_W - 8));
    l.y = u.rand(36, Math.max(37, s.H - LETTER_H - 30));
    void wb;
  }

  function teleportLetter(){
    var cand = [];
    for (var i = 0; i < letters.length; i++) if (!letters[i].dead) cand.push(letters[i]);
    if (!cand.length) return;
    var l = u.choice(cand);
    if (l.masked) unmask(l);
    l.el.classList.add('ep4-tele');
    sfx('whoosh');
    c.wait(150).then(function(){
      if (c.done || l.dead) return;
      relocate(l);
      l.el.style.transform = tr(l.x, l.y);
      l.el.classList.remove('ep4-tele');
      sfx('pop');
      burstAt(l, '✧', ['#7fe3ff', '#f2ecd9'], 5, 60);
    }, function(){});
    c.gag('letters_teleport');
  }

  /* ---------- баннеры и раунды ---------- */
  function showBanner(){
    banner.innerHTML = '';
    var round = ROUNDS[roundIndex];
    banner.appendChild(h.el('div', 'cap', 'РАУНД ' + (roundIndex + 1) + ' / 3'));
    banner.appendChild(h.el('div', 'glyph ep4-arm', round.target));
    banner.appendChild(h.el('div', 'sub', 'ИЩЕМ БУКВУ · 5 ШТУК'));
    banner.classList.remove('show');
    void banner.offsetWidth;
    banner.classList.add('show');
    var cleanup = function(){ banner.classList.remove('show'); };
    banner.addEventListener('animationend', cleanup, { once: true });
    sfx('chalk');
  }

  function applaud(){
    for (var i = 0; i < letters.length; i++){
      var l = letters[i];
      if (l.dead) continue;
      l.el.classList.add('ep4-clap');
      (function(node){ node.addEventListener('animationend', function(){ node.classList.remove('ep4-clap'); }, { once: true }); })(l.el);
    }
    c.gag('letters_applause');
    sfx('applause');
    toast('Пять из пяти. Буквы аплодируют. Иронично.');
  }

  async function roundComplete(){
    if (transitioning) return;
    transitioning = true;
    var clean = streak >= HITS_PER_ROUND;
    if (clean) applaud();
    sfx('sparkle');
    await sw(560);
    if (c.done) return;
    var okLines = (c.text && c.text.pools && c.text.pools.ep4 && c.text.pools.ep4.ok) || [];
    if (roundIndex >= ROUNDS.length - 1){
      await finale();
      return;
    }
    c.say('teacher', pickLine(okLines, 'Неплохо. Для урока.'), { mood: 'proud', ms: 1100 });
    roundIndex++;
    progress = 0;
    streak = 0;
    updateHud();
    hintEl.textContent = ROUNDS[roundIndex].hint;
    spawnLetters();
    showBanner();
    var esc = (c.text && c.text.pools && c.text.pools.ep4 && c.text.pools.ep4.esc) || [];
    var escLine = esc[roundIndex - 1];
    if (escLine) c.say('teacher', escLine, { mood: 'suspicious', ms: 1200 });
    await sw(1050);
    if (c.done) return;
    transitioning = false;
  }

  async function startRound(i){
    roundIndex = i;
    progress = 0;
    streak = 0;
    transitioning = true;
    updateHud();
    speed = ROUNDS[i].speed;
    hintEl.textContent = ROUNDS[i].hint;
    passportTimer = 0; accuseTimer = 0; swapTimer = 0; maskTimer = 0; teleTimer = 0;
    spawnLetters();
    showBanner();
    c.gag('letters_round_' + (i + 1));
    await sw(i === 0 ? 1000 : 900);
    if (c.done) return;
    transitioning = false;
  }

  /* ---------- апдейт ---------- */
  function update(dt, t){
    var s = fieldSize();
    var W = s.W, H = s.H;
    if (!W || !H) return;
    if (transitioning) return;

    if (!strike){
      passportTimer += dt;
      if (passportTimer > 3.4){ passportTimer = 0; showPassport(); }
      if (roundIndex >= 1){
        accuseTimer += dt;
        if (accuseTimer > 2.6){ accuseTimer = 0; showAccuse(); }
        swapTimer += dt;
        if (swapTimer > 3.3){ swapTimer = 0; swapTwo(); }
      }
      if (roundIndex === 2){
        maskTimer += dt;
        if (maskTimer > 2.8){ maskTimer = 0; maskTarget(); }
        teleTimer += dt;
        if (teleTimer > 2.2){ teleTimer = 0; teleportLetter(); }
      }
    }

    for (var i = 0; i < letters.length; i++){
      var l = letters[i];
      if (l.dead || l.el.classList.contains('ep4-tele')) continue;
      var bob = Math.sin(t * 5 + l.phase) * 2;
      if (strike){
        l.el.style.transform = tr(l.x, l.y + bob * 0.4);
        if (l.masked && t > l.maskUntil) unmask(l);
        continue;
      }
      if (l.masked && t > l.maskUntil) unmask(l);
      var ang = Math.atan2(l.vy, l.vx) + u.rand(-1, 1) * 1.2 * dt;
      var sp = speed * l.speedMul;
      l.vx = Math.cos(ang) * sp;
      l.vy = Math.sin(ang) * sp;
      l.x += l.vx * dt;
      l.y += l.vy * dt;
      if (l.x < 6){ l.x = 6; l.vx = Math.abs(l.vx); }
      if (l.x > W - LETTER_W - 6){ l.x = W - LETTER_W - 6; l.vx = -Math.abs(l.vx); }
      if (l.y < 36){ l.y = 36; l.vy = Math.abs(l.vy); }
      if (l.y > H - LETTER_H - 30){ l.y = H - LETTER_H - 30; l.vy = -Math.abs(l.vy); }
      l.el.style.transform = tr(l.x, l.y + bob);
    }

    // расталкивание, чтобы паспорта не слипались в один
    for (var a = 0; a < letters.length; a++){
      var A = letters[a];
      if (A.dead) continue;
      for (var b = a + 1; b < letters.length; b++){
        var B = letters[b];
        if (B.dead) continue;
        var dx = (A.x + LETTER_W / 2) - (B.x + LETTER_W / 2);
        var dy = (A.y + LETTER_H / 2) - (B.y + LETTER_H / 2);
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (d < 86){
          var push = (86 - d) / 2;
          var nx = dx / d, ny = dy / d;
          A.x += nx * push; A.y += ny * push;
          B.x -= nx * push; B.y -= ny * push;
          bounds(A, s); bounds(B, s);
          A.el.style.transform = tr(A.x, A.y);
          B.el.style.transform = tr(B.x, B.y);
        }
      }
    }
  }

  /* ---------- финал ---------- */
  async function finale(){
    transitioning = true;
    strike = false;
    strikeEl.classList.remove('show');
    sfx('paper');
    for (var i = 0; i < letters.length; i++){
      letters[i].el.classList.add('ep4-surrender');
    }
    await sw(500);
    if (c.done) return;
    // бумага
    faceFront.innerHTML = '';
    faceFront.appendChild(h.el('div', 'ep4-pcap', 'ПРОФСОЮЗ «ՏԱՌ» · БУМАГА'));
    faceFront.appendChild(h.el('div', 'ep4-ptext', 'АРТИКЛЬ ВИДЕЛИ У БУХГАЛТЕРИИ'));
    faceFront.appendChild(h.el('div', 'ep4-psub', 'Подпись: профсоюз. Печать: бухгалтерия.'));
    var stampText = 'ՀՈԴԸ ՏԵՂՈՒՄ Է';
    try { if (c.text && c.text.diploma && c.text.diploma.stamp) stampText = c.text.diploma.stamp; } catch(e){}
    faceFront.appendChild(h.el('div', 'ep4-pstamp', stampText));
    faceBack.innerHTML = '';
    faceBack.appendChild(h.el('div', 'ep4-backbig', 'И у вас.'));
    faceBack.appendChild(h.el('div', 'ep4-backsub', 'НА ОБОРОТЕ · ПРОВЕРЕНО'));
    paper.classList.add('show');
    c.gag('letters_confession');
    sfx('paper');
    await sw(900);
    if (c.done) return;
    paper.classList.add('flip');
    sfx('stamp');
    await sw(650);
    if (c.done) return;
    await c.say('teacher', 'Бухгалтерия. Конечно.', { mood: 'tired', ms: 1100 }).catch(function(){});
    if (c.done) return;
    c.say('system', 'ДЕЛО ПЕРЕДАНО В БУХГАЛТЕРИЮ.', { ms: 1500 });
    if (misses === 0){ c.gag('letters_perfect'); }
    await sw(1500);
    if (c.done) return;
    if (endResolve) endResolve();
  }

  /* ---------- старт ---------- */
  updateHud();
  try {
    c.mood('teacher', 'suspicious');
    c.say('teacher', 'Буквы видели артикль. Найди подозрительные.', { mood: 'suspicious', ms: 1500 });
    await sw(900);
    if (c.done) return;
    c.say('system', 'ПРОФСОЮЗ «ՏԱՌ»: НЕ ТРОГАЙТЕ ЧУЖИЕ ГЛИФЫ.', { ms: 1400 });
    await sw(1100);
    if (c.done) return;
    await startRound(0);
    if (c.done) return;
    c.raf(update);
    await endPromise;
  } catch(e){
    if (!(e && e.__skip)) console.error('[ep4]', e);
  }
};
})();

  /* -------------------------------------------------------------- данные */
  var CARDS = [
    { id: 'tun', glyph: 'տուն', ru: 'дом', correct: true },

  ];
  var HINTS = [
    'Занятие № 1. Ответь. Потом нажми большую кнопку.',

    'Занятие № 447. Вопрос уже не вопрос. Привычка.',

  ];
  var QUESTIONS = [
    'Как будет «дом»?',
    'Как будет «дом»? (мы это уже проходили)',
    'Как будет «дом»? (это занятие № 247)',

  ];
